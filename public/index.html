<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAE 뉴스 브리핑</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0c10; --surface:#111418; --surface2:#181c22;
    --border:#1e2530; --gold:#c8a84b; --gold-dim:#8a7035;
    --text:#e8eaf0; --text-dim:#7a8394; --text-muted:#3e4757;
    --red:#e05252; --green:#4caf7d; --blue:#4a9eff; --tag-bg:#1a2030;
    --heart:#ff6b8a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

  /* ── TOP BAR ── */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(10,12,16,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.08em}
  .logo-icon{width:28px;height:28px;background:linear-gradient(135deg,var(--gold),#8a6010);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px}
  .logo-text{color:var(--gold)} .logo-sub{color:var(--text-dim);font-size:11px}
  .topbar-right{display:flex;align-items:center;gap:10px}
  .refresh-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'Space Mono',monospace;transition:all .2s}
  .refresh-btn:hover{border-color:var(--gold);color:var(--gold)}
  .last-updated{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-muted)}
  .badge-live{display:inline-flex;align-items:center;gap:5px;font-family:'Space Mono',monospace;font-size:10px;color:var(--green);background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.2);padding:3px 8px;border-radius:4px}
  .badge-live::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* ── LAYOUT ── */
  .layout{display:flex;margin-top:56px;min-height:calc(100vh - 56px)}

  /* ── SIDEBAR ── */
  .sidebar{width:260px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:20px 16px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
  .sidebar-section{margin-bottom:24px}
  .sidebar-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px;padding:0 4px}
  .keyword-list{display:flex;flex-direction:column;gap:4px}
  .keyword-item{display:flex;align-items:center;justify-content:space-between;background:var(--tag-bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;transition:all .15s}
  .keyword-item:hover{border-color:var(--gold-dim)}
  .keyword-item.active{border-color:var(--gold);background:rgba(200,168,75,.08)}
  .keyword-count{font-family:'Space Mono',monospace;font-size:11px;color:var(--gold);background:rgba(200,168,75,.12);padding:1px 6px;border-radius:3px}
  .filter-list{display:flex;flex-direction:column;gap:4px}
  .filter-item{display:flex;align-items:center;justify-content:space-between;background:rgba(224,82,82,.06);border:1px solid rgba(224,82,82,.2);border-radius:6px;padding:6px 10px;font-size:13px}
  .filter-remove{color:var(--red);cursor:pointer;font-size:16px;line-height:1;opacity:.6;transition:opacity .15s}
  .filter-remove:hover{opacity:1}
  .add-row{display:flex;gap:6px;margin-top:8px}
  .add-input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color .15s}
  .add-input:focus{border-color:var(--gold-dim)}
  .add-btn{background:var(--gold);color:var(--bg);border:none;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;font-weight:700;transition:opacity .15s}
  .add-btn:hover{opacity:.85}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
  .stat-num{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--gold)}
  .stat-label{font-size:11px;color:var(--text-dim);margin-top:2px}

  /* ── TAB BAR (피드 / 보관함) ── */
  .tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
  .tab-btn{padding:8px 18px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text-muted);border-bottom:2px solid transparent;transition:all .15s;font-family:'Noto Sans KR',sans-serif}
  .tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
  .tab-btn .tab-count{font-family:'Space Mono',monospace;font-size:10px;background:rgba(200,168,75,.15);color:var(--gold);padding:1px 6px;border-radius:3px;margin-left:6px}

  /* ── MAIN ── */
  .main{flex:1;padding:20px 24px;max-width:960px}
  .feed-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .feed-title{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase}
  .sort-tabs{display:flex;gap:4px}
  .sort-tab{font-size:11px;padding:4px 10px;border-radius:4px;cursor:pointer;font-family:'Space Mono',monospace;border:1px solid transparent;color:var(--text-muted);transition:all .15s}
  .sort-tab.active{border-color:var(--border);background:var(--surface2);color:var(--text)}
  .filter-notice{background:rgba(224,82,82,.06);border:1px solid rgba(224,82,82,.15);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:8px}

  /* ── NEWS CARDS ── */
  .news-list{display:flex;flex-direction:column;gap:10px}
  .news-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:all .18s;position:relative;animation:fadeUp .3s ease both;display:block;color:inherit}
  .news-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border);transition:background .15s;z-index:1}
  .news-card:hover{border-color:#2a3040;background:var(--surface2)}
  .news-card:hover::before{background:var(--gold)}
  .news-card.highlight{border-color:rgba(200,168,75,.3);background:linear-gradient(135deg,rgba(200,168,75,.04) 0%,var(--surface) 60%)}
  .news-card.highlight::before{background:var(--gold)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* ── 카드 레이아웃 ── */
  .card-inner{display:flex;min-height:0}
  .card-body{flex:1;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:6px}
  .card-thumb{width:140px;flex-shrink:0;position:relative;overflow:hidden;background:var(--surface2)}
  .card-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
  .news-card:hover .card-thumb img{transform:scale(1.04)}
  .card-thumb-placeholder{width:100%;height:100%;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}

  /* ── 언론사 로고 ── */
  .source-row{display:flex;align-items:center;gap:7px}
  .source-favicon{width:14px;height:14px;border-radius:2px;object-fit:contain;flex-shrink:0;opacity:.85}
  .source-favicon-fallback{width:14px;height:14px;border-radius:2px;background:var(--gold-dim);display:inline-flex;align-items:center;justify-content:center;font-size:7px;color:var(--bg);font-weight:700;flex-shrink:0;font-family:'Space Mono',monospace}
  .card-source{font-family:'Space Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.04em;font-weight:700}
  .card-time{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-muted)}

  .card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
  .card-tag{font-size:10px;padding:2px 7px;border-radius:3px;background:var(--tag-bg);color:var(--text-dim);border:1px solid var(--border)}
  .card-tag.dubai{color:#4a9eff;border-color:rgba(74,158,255,.25);background:rgba(74,158,255,.07)}
  .card-tag.abudhabi{color:#a78bfa;border-color:rgba(167,139,250,.25);background:rgba(167,139,250,.07)}
  .card-tag.uae{color:var(--gold);border-color:rgba(200,168,75,.25);background:rgba(200,168,75,.07)}
  .card-title{font-size:14px;font-weight:600;line-height:1.5;color:var(--text)}
  .card-desc{font-size:12px;color:var(--text-dim);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
  .card-link{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-muted);text-decoration:none}
  .card-actions{display:flex;gap:4px;align-items:center}
  .card-action-btn{font-size:11px;color:var(--text-muted);cursor:pointer;padding:3px 8px;border-radius:4px;border:1px solid transparent;transition:all .15s;background:none;font-family:'Noto Sans KR',sans-serif}
  .card-action-btn:hover{border-color:var(--border);color:var(--text)}
  .card-action-btn.hide:hover{color:var(--red);border-color:rgba(224,82,82,.3)}

  /* ── 하트 버튼 ── */
  .heart-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:3px 6px;border-radius:4px;transition:all .15s;line-height:1;color:var(--text-muted)}
  .heart-btn:hover{color:var(--heart);transform:scale(1.2)}
  .heart-btn.liked{color:var(--heart);animation:heartPop .25s ease}
  @keyframes heartPop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}

  /* ── 독창성 배지 ── */
  .orig-badge{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:3px;text-transform:uppercase}
  .orig-badge.exclusive{background:rgba(245,158,66,.18);color:#f59e42;border:1px solid rgba(245,158,66,.4)}
  .orig-badge.original{background:rgba(76,175,125,.15);color:var(--green);border:1px solid rgba(76,175,125,.35)}

  /* ── 그룹 카드 ── */
  .group-card{padding-bottom:0}
  .group-lead-link{display:block;text-decoration:none;color:inherit}
  .dupe-toggle{background:none;border:none;cursor:pointer;font-size:11px;color:var(--text-muted);font-family:'Noto Sans KR',sans-serif;padding:0;text-align:left;transition:color .15s;line-height:1.5}
  .dupe-toggle:hover{color:var(--text-dim)}
  .group-footer{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 12px}
  .dupe-list{border-top:1px solid var(--border);background:rgba(0,0,0,.2)}
  .dupe-item{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid rgba(30,37,48,.6);text-decoration:none;color:inherit;transition:background .1s}
  .dupe-item:last-child{border-bottom:none}
  .dupe-item:hover{background:rgba(255,255,255,.02)}
  .dupe-src-wrap{display:flex;align-items:center;gap:5px;min-width:90px}
  .dupe-favicon{width:12px;height:12px;border-radius:2px;object-fit:contain;opacity:.7}
  .dupe-source{font-family:'Space Mono',monospace;font-size:9px;color:var(--text-muted);white-space:nowrap}
  .dupe-title{font-size:12px;color:var(--text-dim);flex:1;line-height:1.4;transition:color .15s}
  .dupe-item:hover .dupe-title{color:var(--text)}
  .dupe-time{font-family:'Space Mono',monospace;font-size:9px;color:var(--text-muted);white-space:nowrap}

  /* ── 태그 모달 ── */
  .modal-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:center;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;width:320px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px}
  .modal-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;min-height:32px}
  .modal-tag{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--tag-bg);color:var(--text-dim);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px}
  .modal-tag:hover{border-color:var(--gold-dim);color:var(--text)}
  .modal-tag.selected{background:rgba(200,168,75,.15);border-color:var(--gold);color:var(--gold)}
  .modal-tag .tag-remove{font-size:14px;color:var(--red);opacity:.6;cursor:pointer}
  .modal-tag .tag-remove:hover{opacity:1}
  .modal-add-row{display:flex;gap:8px;margin-bottom:16px}
  .modal-input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 10px;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none}
  .modal-input:focus{border-color:var(--gold-dim)}
  .modal-save-btn{background:var(--gold);color:var(--bg);border:none;border-radius:6px;padding:7px 14px;font-size:12px;cursor:pointer;font-weight:700}
  .modal-close-btn{width:100%;background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px;cursor:pointer}

  /* ── 보관함 ── */
  .bookmarks-empty{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:13px}
  .bookmark-tag-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .btag-btn{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:var(--tag-bg);color:var(--text-dim);cursor:pointer;transition:all .15s}
  .btag-btn.active{background:rgba(200,168,75,.15);border-color:var(--gold);color:var(--gold)}
  .bookmark-tags-on-card{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
  .btag-chip{font-size:10px;padding:1px 7px;border-radius:10px;background:rgba(200,168,75,.12);color:var(--gold);border:1px solid rgba(200,168,75,.2)}

  /* ── 로딩 / 빈 화면 ── */
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px}
  .loading-spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-family:'Space Mono',monospace;font-size:12px;color:var(--text-muted)}
  .empty{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:13px}

  /* ── 읽음 / 안읽음 ── */
  .news-card.read{opacity:.45;filter:saturate(.3)}
  .news-card.read .card-title{color:var(--text-dim)}
  .news-card.read:hover{opacity:.75;filter:saturate(.6)}
  .read-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex-shrink:0;box-shadow:0 0 5px var(--blue);transition:all .2s}
  .news-card.read .read-dot{background:var(--text-muted);box-shadow:none}

  /* ── 체크박스 선택 ── */
  .news-card{position:relative}
  .card-checkbox{position:absolute;top:12px;left:12px;z-index:10;
    width:18px;height:18px;border-radius:4px;border:2px solid var(--border);
    background:var(--surface2);cursor:pointer;display:none;
    transition:all .15s;appearance:none;-webkit-appearance:none}
  .card-checkbox:checked{background:var(--blue);border-color:var(--blue);
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 10 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 4l3 3 5-6' stroke='white' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-size:10px;background-repeat:no-repeat;background-position:center}
  .select-mode .card-checkbox{display:block}
  .select-mode .news-card{padding-left:4px}
  .select-mode .news-card.selected{border-color:rgba(74,158,255,.5);background:rgba(74,158,255,.05)}
  .select-mode .news-card.selected::before{background:var(--blue)}

  /* ── 선택 툴바 ── */
  .select-toolbar{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:10px 16px;
    display:none;align-items:center;gap:10px;z-index:150;
    box-shadow:0 8px 32px rgba(0,0,0,.5);backdrop-filter:blur(8px);
    animation:slideUp .2s ease;white-space:nowrap
  }
  .select-toolbar.visible{display:flex}
  @keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .sel-count{font-family:'Space Mono',monospace;font-size:12px;color:var(--gold);
    background:rgba(200,168,75,.12);padding:3px 10px;border-radius:20px}
  .sel-btn{font-size:12px;padding:6px 14px;border-radius:7px;border:1px solid var(--border);
    background:var(--surface2);color:var(--text-dim);cursor:pointer;transition:all .15s;
    font-family:'Noto Sans KR',sans-serif}
  .sel-btn:hover{color:var(--text);border-color:#3a4557}
  .sel-btn.danger:hover{color:var(--red);border-color:rgba(224,82,82,.4)}
  .sel-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .sel-btn.primary:hover{opacity:.85}
  .sel-divider{width:1px;height:20px;background:var(--border)}

  /* ── 선택모드 토글 버튼 ── */
  .select-mode-btn{font-size:11px;padding:4px 12px;border-radius:6px;
    border:1px solid var(--border);background:var(--surface2);
    color:var(--text-muted);cursor:pointer;transition:all .15s;
    font-family:'Space Mono',monospace}
  .select-mode-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(74,158,255,.08)}

  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-icon">🇦🇪</div>
    <div><div class="logo-text">UAE BRIEFING</div><div class="logo-sub">두바이 · 아부다비 · UAE</div></div>
  </div>
  <div class="topbar-right">
    <span class="badge-live">LIVE</span>
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="refresh-btn" onclick="loadNews()">↻ 새로고침</button>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">📡 검색 키워드</div>
      <div class="keyword-list" id="keywordList"></div>
      <div class="add-row">
        <input class="add-input" id="newKeyword" placeholder="키워드 추가..." onkeydown="if(event.key==='Enter')addKeyword()">
        <button class="add-btn" onclick="addKeyword()">+</button>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">🚫 제외 키워드</div>
      <div class="filter-list" id="filterList"></div>
      <div class="add-row">
        <input class="add-input" id="newFilter" placeholder="제외할 단어..." onkeydown="if(event.key==='Enter')addFilter()">
        <button class="add-btn" style="background:var(--red)" onclick="addFilter()">+</button>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">📊 현황</div>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-num">—</div><div class="stat-label">전체 기사</div></div>
        <div class="stat-card"><div class="stat-num" style="color:var(--red)">—</div><div class="stat-label">필터됨</div></div>
        <div class="stat-card"><div class="stat-num" style="color:#f59e42">—</div><div class="stat-label">단독</div></div>
        <div class="stat-card"><div class="stat-num" style="color:var(--green)">—</div><div class="stat-label">심층</div></div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="feed-header">
      <div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="select-mode-btn" id="selectModeBtn" onclick="toggleSelectMode()">☑ 선택</button>
        <div class="sort-tabs">
          <div class="sort-tab active" onclick="setSort(this,'latest')">최신순</div>
          <div class="sort-tab" onclick="setSort(this,'group')">묶음순</div>

// ── HTML 엔티티 디코딩 ────────────────────────────────────────────────────
function decodeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ')
    .replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(n))
    .replace(/<[^>]+>/g,''); // strip any leftover tags
}

// ── 네이버 인뉴스 URL 변환 ────────────────────────────────────────────────
// 네이버 API가 돌려주는 originallink / link 중 news.naver.com 형태 우선 사용
// api/news.js 에서 naverLink 필드를 함께 보내줌
function naverNewsUrl(item) {
  // item.naverLink 는 news.naver.com/... 형태 (api에서 주입)
  if (item.naverLink) return item.naverLink;
  // fallback: 네이버 검색으로
  return `https://search.naver.com/search.naver?where=news&query=${encodeURIComponent(item.title||'')}`;
}

function sourceDisplay(domain) {
  if (!domain) return '';
  const clean = domain.replace(/^www\./,'');
  return SOURCE_DISPLAY[clean] || clean.replace(/\.(co\.kr|com|kr|net)$/,'').split('.').slice(-1)[0];
}
function faviconUrl(domain) {
  if (!domain) return null;
  return `https://www.google.com/s2/favicons?sz=32&domain=${domain}`;
}
function sourceFaviconHtml(domain, size=14) {
  const disp = sourceDisplay(domain);

  return `<img class="source-favicon" width="${size}" height="${size}"
    src="${faviconUrl(domain)}"
    onerror="this.outerHTML='<span class=\\'source-favicon-fallback\\'>${initial}</span>'"
    alt="${disp}">`;
}

// ── API ───────────────────────────────────────────────────────────────────
async function loadNews() {
  const btn = document.querySelector('.refresh-btn');
  btn.textContent = '↻ 불러오는 중...';
  if (state.activeTab === 'feed')
    document.getElementById('newsList').innerHTML =
      `<div class="loading"><div class="loading-spinner"></div><div class="loading-text">뉴스 불러오는 중...</div></div>`;
  try {
    let data;
    if (DEMO_MODE) { await new Promise(r=>setTimeout(r,800)); data=DEMO; }
    else {
      const p = new URLSearchParams({keywords:state.keywords.join(','), filters:state.filters.join(',')});
      const res = await fetch(`${API_BASE}?${p}`);
      if (!res.ok) throw new Error();
      data = await res.json();
    }
    state.data = data;
    const d = new Date(data.fetchedAt);
    document.getElementById('lastUpdated').textContent =
      `업데이트 ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
  } catch(e) { state.data = DEMO; }
  btn.textContent = '↻ 새로고침';
  render();
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  renderKeywords(); renderFilters(); renderStats();
  updateBookmarkCount();
  if (state.activeTab==='feed') renderFeed();
  else renderBookmarks();
}

function renderKeywords() {
  const data = state.data; const counts = {};
  if (data) data.groups.forEach(g=>{const k=g.lead.keyword; counts[k]=(counts[k]||0)+1+g.others.length;});
  document.getElementById('keywordList').innerHTML = state.keywords.map(kw=>`
    <div class="keyword-item ${state.activeKeyword===kw?'active':''}" onclick="toggleKeyword('${kw}')">
      <span>${kw}</span><span class="keyword-count">${counts[kw]||0}</span>
    </div>`).join('');
}
function renderFilters() {
  document.getElementById('filterList').innerHTML = state.filters.map(f=>`
    <div class="filter-item"><span>${f}</span>
      <span class="filter-remove" onclick="removeFilter('${f}')">×</span>
    </div>`).join('');
}

function renderFeed() {
  const list=document.getElementById('newsList'), notice=document.getElementById('filterNotice');
  const data=state.data; if(!data) return;
  if (data.filteredCount>0) {
    notice.style.display='flex';
    notice.innerHTML=`🚫 제외 키워드(${data.filteredReasons.join(', ')})로 <strong style="color:var(--red);margin:0 3px">${data.filteredCount}건</strong> 필터링됨`;
  } else notice.style.display='none';
  let groups = data.groups.filter(g=>!state.hidden.has(g.id));
  if (state.activeKeyword) groups=groups.filter(g=>g.lead.keyword===state.activeKeyword);
  if (!groups.length) { list.innerHTML=`<div class="empty">조건에 맞는 뉴스가 없습니다</div>`; return; }
  list.innerHTML = groups.map((g,i)=>renderCard(g,i)).join('');
}

function renderBookmarks() {
  const list=document.getElementById('newsList');
  document.getElementById('filterNotice').style.display='none';
  const likedIds = Object.keys(state.likes).filter(id=>state.likes[id]);
  if (!likedIds.length) { list.innerHTML=`<div class="bookmarks-empty">♥ 좋아요 누른 기사가 없어요<br><span style="font-size:11px;margin-top:8px;display:block">기사 카드의 ♡ 버튼을 눌러보세요</span></div>`; return; }
  const allGroups = state.data?.groups||[];
  let saved = allGroups.filter(g=>likedIds.includes(g.id));

  // 태그 필터
  const allBTags = [...new Set(likedIds.flatMap(id=>state.tags[id]||[]))];
  const tagFilterHtml = allBTags.length ? `<div class="bookmark-tag-filter">
    <button class="btag-btn ${!state.activeBookmarkTag?'active':''}" onclick="setBookmarkTag(null)">전체</button>
    ${allBTags.map(t=>`<button class="btag-btn ${state.activeBookmarkTag===t?'active':''}" onclick="setBookmarkTag('${t}')">${t}</button>`).join('')}
  </div>` : '';

  if (state.activeBookmarkTag) saved=saved.filter(g=>(state.tags[g.id]||[]).includes(state.activeBookmarkTag));
  if (!saved.length) { list.innerHTML=tagFilterHtml+`<div class="empty">해당 태그 기사가 없습니다</div>`; return; }
  list.innerHTML = tagFilterHtml + saved.map((g,i)=>renderCard(g,i,true)).join('');
}

function renderCard(g, i, isBookmark=false) {
  const lead = g.lead;
  const isGroup = g.others.length>0;
  const isExpanded = state.expandedGroups.has(g.id);
  const isLiked = !!state.likes[g.id];
  const isRead  = !!state.read[g.id];
  const isSelected = state.selected.has(g.id);
  const cardTags = state.tags[g.id]||[];
  const highlight = lead.originality==='exclusive'||lead.originality==='original';

  const badge = lead.originality==='exclusive'
    ? `<span class="orig-badge exclusive">단독</span>`
    : lead.originality==='original' ? `<span class="orig-badge original">심층</span>` : '';

  const title = decodeHtml(lead.title).replace(/^\[단독\]\s*/,'');
  const desc  = decodeHtml(lead.description);
  const href  = naverNewsUrl(lead);
  const srcDisp = sourceDisplay(lead.source);

  const thumbHtml = lead.thumbnail
    ? `<img src="${lead.thumbnail}" alt="" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML=fallbackThumb('${lead.source}')">`
    : fallbackThumb(lead.source);

  const dupeRows = g.others.map(n=>{
    const dHref = naverNewsUrl(n);
    const dDisp = sourceDisplay(n.source);
    return `<a class="dupe-item" href="${dHref}" target="_blank" rel="noopener noreferrer">
      <div class="dupe-src-wrap">
        <img class="dupe-favicon" src="${faviconUrl(n.source)}" onerror="this.style.display='none'" alt="">
        <span class="dupe-source">${dDisp}</span>
      </div>
      <span class="dupe-title">${decodeHtml(n.title)}</span>
      <span class="dupe-time">${n.time||''}</span>
    </a>`;
  }).join('');

  const otherSources = g.others.map(n=>sourceDisplay(n.source)).join(', ');
  const tagChips = cardTags.map(t=>`<span class="btag-chip">${t}</span>`).join('');

  return `
  <div class="news-card ${isGroup?'group-card':''} ${highlight?'highlight':''} ${isRead?'read':''} ${isSelected?'selected':''}"
       style="animation-delay:${i*40}ms" id="card-${g.id}"
       onclick="handleCardClick('${g.id}',event)">
    <input type="checkbox" class="card-checkbox" ${isSelected?'checked':''} onclick="toggleSelect('${g.id}',event)">
    <a class="group-lead-link" href="${href}" target="_blank" rel="noopener noreferrer"
       onclick="markRead('${g.id}',event)">
      <div class="card-inner">
        <div class="card-body">
          <div class="card-meta">
            <span class="read-dot" title="${isRead?'읽음':'안읽음'}"></span>
            ${badge}
            <div class="source-row">
              ${sourceFaviconHtml(lead.source)}
              <span class="card-source">${srcDisp}</span>
            </div>
            <span class="card-time">${lead.time||''}</span>
            <div class="card-tags">${tagsFor(lead.keyword)}</div>
          </div>
          <div class="card-title">${title}</div>
          <div class="card-desc">${desc}</div>
          ${tagChips ? `<div class="bookmark-tags-on-card">${tagChips}</div>` : ''}
          <div class="card-footer">
            <span class="card-link">네이버 뉴스에서 보기 →</span>
            <div class="card-actions">
              <button class="heart-btn ${isLiked?'liked':''}" onclick="toggleLike('${g.id}',event)" title="보관함에 저장">${isLiked?'♥':'♡'}</button>
              <button class="card-action-btn" onclick="openTagModal('${g.id}',event)" title="태그 달기">🏷</button>
              <button class="card-action-btn" onclick="toggleReadBtn('${g.id}',event)" title="읽음 표시">${isRead?'● 읽음':'○ 읽음'}</button>
              <button class="card-action-btn hide" onclick="hideCard('${g.id}',event)">숨기기</button>
              <button class="card-action-btn" onclick="copyTitle('${escAttr(title)}',event)">복사</button>
            </div>
          </div>
        </div>
        <div class="card-thumb">${thumbHtml}</div>
      </div>
    </a>
    ${isGroup ? `
    <div class="group-footer">
      <button class="dupe-toggle" onclick="toggleGroup('${g.id}',event)">
        ${isExpanded ? '▲ 접기'
          : `▼ <span style="color:var(--text-dim)">${srcDisp}</span> 외 <strong style="color:var(--gold)">${g.others.length}건</strong> — ${otherSources}`}
      </button>
    </div>
    ${isExpanded ? `<div class="dupe-list">${dupeRows}</div>` : ''}` : ''}
  </div>`;
}

function fallbackThumb(source) {
  const disp = sourceDisplay(source||'');
  return `<div class="card-thumb-placeholder" style="min-height:110px;background:var(--surface2)">
    <img class="source-favicon" width="28" height="28" style="width:28px;height:28px;border-radius:4px;opacity:.5"
      src="${faviconUrl(source)}" onerror="this.style.display='none'" alt="">
    <span style="font-size:10px;color:var(--text-muted);font-family:'Space Mono',monospace;margin-top:4px">${disp}</span>
  </div>`;
}

function tagsFor(kw) {
  const map={'두바이':'dubai','아부다비':'abudhabi','UAE':'uae'};
  return `<span class="card-tag ${map[kw]||''}">${kw}</span>`;
}

function renderStats() {
  const data=state.data; if(!data) return;
  const ex=data.groups.filter(g=>g.lead.originality==='exclusive').length;
  const or=data.groups.filter(g=>g.lead.originality==='original').length;
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.total||data.groups.length}</div><div class="stat-label">전체 기사</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--red)">${data.filteredCount}</div><div class="stat-label">필터됨</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#f59e42">${ex}</div><div class="stat-label">단독</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green)">${or}</div><div class="stat-label">심층</div></div>`;
}

function updateBookmarkCount() {
  const n = Object.values(state.likes).filter(Boolean).length;
  document.getElementById('bookmarkCount').textContent = n;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────
function toggleLike(gid, e) {
  e.stopPropagation(); e.preventDefault();
  state.likes[gid] = !state.likes[gid];
  savePersist(); render();
}

function openTagModal(gid, e) {
  e.stopPropagation(); e.preventDefault();
  state.tagModalId = gid;
  renderTagModal();
  document.getElementById('tagModal').classList.add('open');
}
function closeTagModal() {
  document.getElementById('tagModal').classList.remove('open');
  state.tagModalId = null;
  state._bulkIds = null;
  if (state.selectMode) clearSelection();
  else render();
}
function renderTagModal() {
  const gid = state.tagModalId;
  const selected = state.tags[gid]||[];
  document.getElementById('modalTagList').innerHTML = state.allTags.map(t=>`
    <span class="modal-tag ${selected.includes(t)?'selected':''}" onclick="toggleTagOnCard('${t}')">
      ${t}${selected.includes(t)?` <span class="tag-remove" onclick="removeTagFromAll(event,'${t}')">×</span>`:''}
    </span>`).join('');
}
function toggleTagOnCard(tag) {
  const gid = state.tagModalId;
  if (!gid) return;
  const ids = gid === '__bulk__' ? (state._bulkIds||[]) : [gid];
  ids.forEach(id => {
    if (!state.tags[id]) state.tags[id]=[];
    const idx=state.tags[id].indexOf(tag);
    if(idx>-1) state.tags[id].splice(idx,1); else state.tags[id].push(tag);
    if(state.tags[id].length>0) state.likes[id]=true;
  });
  savePersist(); renderTagModal();
}
function addModalTag() {
  const inp=document.getElementById('modalTagInput'), v=inp.value.trim();
  if(!v) return;
  if(!state.allTags.includes(v)) state.allTags.push(v);
  toggleTagOnCard(v);
  inp.value='';
}
function removeTagFromAll(e, tag) {
  e.stopPropagation();
  state.allTags=state.allTags.filter(t=>t!==tag);
  Object.keys(state.tags).forEach(id=>{
    state.tags[id]=(state.tags[id]||[]).filter(t=>t!==tag);
  });
  savePersist(); renderTagModal();
}

function switchTab(el, tab) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  state.activeTab=tab; render();
}
function setBookmarkTag(tag) { state.activeBookmarkTag=tag; render(); }

function toggleKeyword(kw) { state.activeKeyword=state.activeKeyword===kw?null:kw; render(); }
function toggleGroup(gid,e) {
  e.stopPropagation(); e.preventDefault();
  state.expandedGroups.has(gid)?state.expandedGroups.delete(gid):state.expandedGroups.add(gid); render();
}
function hideCard(gid,e) { e.stopPropagation(); e.preventDefault(); state.hidden.add(gid); render(); }
function copyTitle(title,e) {
  e.stopPropagation(); e.preventDefault();
  navigator.clipboard.writeText(title).catch(()=>{});
  const btn=e.target; btn.textContent='복사됨!'; setTimeout(()=>btn.textContent='복사',1200);
}
function addKeyword() {
  const i=document.getElementById('newKeyword'),v=i.value.trim();
  if(v&&!state.keywords.includes(v)){state.keywords.push(v);i.value='';loadNews();}
}
function addFilter() {
  const i=document.getElementById('newFilter'),v=i.value.trim();
  if(v&&!state.filters.includes(v)){state.filters.push(v);i.value='';if(state.data)render();}
}
function removeFilter(f){state.filters=state.filters.filter(x=>x!==f);if(state.data)render();}
function setSort(el,sort){
  document.querySelectorAll('.sort-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active'); state.sort=sort; render();
}

// ── 읽음 처리 ─────────────────────────────────────────────────────────────
function markRead(gid, e) {
  // 링크 클릭 시 자동 읽음 처리 (e는 그냥 통과)
  state.read[gid] = true;
  savePersist();
  // DOM 직접 업데이트 (re-render 없이)
  const card = document.getElementById('card-'+gid);
  if (card) {
    card.classList.add('read');
    const dot = card.querySelector('.read-dot');
    if (dot) dot.title = '읽음';
    const readBtn = card.querySelector('.card-action-btn[onclick*="toggleReadBtn"]');
    if (readBtn) readBtn.textContent = '● 읽음';
  }
}
function toggleReadBtn(gid, e) {
  e.stopPropagation(); e.preventDefault();
  state.read[gid] = !state.read[gid];
  savePersist();
  const card = document.getElementById('card-'+gid);
  if (card) {
    card.classList.toggle('read', !!state.read[gid]);
    const btn = e.target;
    btn.textContent = state.read[gid] ? '● 읽음' : '○ 읽음';
    const dot = card.querySelector('.read-dot');
    if (dot) dot.title = state.read[gid] ? '읽음' : '안읽음';
  }
}

// ── 선택 모드 ─────────────────────────────────────────────────────────────
function toggleSelectMode() {
  state.selectMode = !state.selectMode;
  state.selected.clear();
  const btn = document.getElementById('selectModeBtn');
  const list = document.getElementById('newsList');
  btn.classList.toggle('active', state.selectMode);
  list.classList.toggle('select-mode', state.selectMode);
  updateToolbar();
}
function handleCardClick(gid, e) {
  if (!state.selectMode) return;
  // 선택모드일 때 카드 클릭 = 체크박스 토글
  if (e.target.closest('a') && !e.target.closest('.card-checkbox')) return;
  toggleSelect(gid, e);
}
function toggleSelect(gid, e) {
  e.stopPropagation(); e.preventDefault();
  if (state.selected.has(gid)) state.selected.delete(gid);
  else state.selected.add(gid);
  const card = document.getElementById('card-'+gid);
  if (card) {
    card.classList.toggle('selected', state.selected.has(gid));
    const cb = card.querySelector('.card-checkbox');
    if (cb) cb.checked = state.selected.has(gid);
  }
  updateToolbar();
}
function updateToolbar() {
  const n = state.selected.size;
  const tb = document.getElementById('selectToolbar');
  tb.classList.toggle('visible', state.selectMode && n > 0);
  document.getElementById('selCount').textContent = `${n}개 선택`;
}
function clearSelection() {
  state.selected.clear();
  state.selectMode = false;
  document.getElementById('selectModeBtn').classList.remove('active');
  document.getElementById('newsList').classList.remove('select-mode');
  updateToolbar();
  render();
}

// ── 일괄 작업 ─────────────────────────────────────────────────────────────
function bulkMarkRead() {
  state.selected.forEach(id => { state.read[id]=true; });
  savePersist(); clearSelection();
}
function bulkMarkUnread() {
  state.selected.forEach(id => { state.read[id]=false; });
  savePersist(); clearSelection();
}
function bulkLike() {
  state.selected.forEach(id => { state.likes[id]=true; });
  savePersist(); clearSelection();
}
function bulkHide() {
  state.selected.forEach(id => state.hidden.add(id));
  clearSelection();
}
function bulkOpenTagModal() {
  // 선택된 것들 중 첫 번째로 태그 모달 열기 (일괄 적용)
  const ids = [...state.selected];
  if (!ids.length) return;
  state.tagModalId = '__bulk__';
  state._bulkIds = ids;
  renderTagModal();
  document.getElementById('tagModal').classList.add('open');
}


function escAttr(s=''){return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;')}

// 모달 바깥 클릭 닫기
document.getElementById('tagModal').addEventListener('click',function(e){
  if(e.target===this) closeTagModal();
});

// ── INIT ──────────────────────────────────────────────────────────────────
loadNews();
</script>
</body>
</html>
