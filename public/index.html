<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAE 뉴스 브리핑</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0c10; --surface:#111418; --surface2:#181c22;
    --border:#1e2530; --gold:#c8a84b; --gold-dim:#8a7035;
    --text:#e8eaf0; --text-dim:#7a8394; --text-muted:#3e4757;
    --red:#e05252; --green:#4caf7d; --blue:#4a9eff; --tag-bg:#1a2030;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

  /* TOP BAR */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,12,16,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.08em}
  .logo-icon{width:28px;height:28px;background:linear-gradient(135deg,var(--gold),#8a6010);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px}
  .logo-text{color:var(--gold)} .logo-sub{color:var(--text-dim);font-size:11px}
  .topbar-right{display:flex;align-items:center;gap:12px}
  .refresh-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'Space Mono',monospace;transition:all .2s}
  .refresh-btn:hover{border-color:var(--gold);color:var(--gold)}
  .last-updated{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-muted)}
  .badge-live{display:inline-flex;align-items:center;gap:5px;font-family:'Space Mono',monospace;font-size:10px;color:var(--green);background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.2);padding:3px 8px;border-radius:4px}
  .badge-live::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* LAYOUT */
  .layout{display:flex;margin-top:56px;min-height:calc(100vh - 56px)}

  /* SIDEBAR */
  .sidebar{width:260px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:20px 16px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
  .sidebar-section{margin-bottom:28px}
  .sidebar-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px;padding:0 4px}
  .keyword-list{display:flex;flex-direction:column;gap:4px}
  .keyword-item{display:flex;align-items:center;justify-content:space-between;background:var(--tag-bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;transition:all .15s}
  .keyword-item:hover{border-color:var(--gold-dim)}
  .keyword-item.active{border-color:var(--gold);background:rgba(200,168,75,.08)}
  .keyword-count{font-family:'Space Mono',monospace;font-size:11px;color:var(--gold);background:rgba(200,168,75,.12);padding:1px 6px;border-radius:3px}
  .filter-list{display:flex;flex-direction:column;gap:4px}
  .filter-item{display:flex;align-items:center;justify-content:space-between;background:rgba(224,82,82,.06);border:1px solid rgba(224,82,82,.2);border-radius:6px;padding:6px 10px;font-size:13px}
  .filter-remove{color:var(--red);cursor:pointer;font-size:16px;line-height:1;opacity:.6;transition:opacity .15s}
  .filter-remove:hover{opacity:1}
  .add-row{display:flex;gap:6px;margin-top:8px}
  .add-input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color .15s}
  .add-input:focus{border-color:var(--gold-dim)}
  .add-btn{background:var(--gold);color:var(--bg);border:none;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;font-weight:700;transition:opacity .15s}
  .add-btn:hover{opacity:.85}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
  .stat-num{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--gold)}
  .stat-label{font-size:11px;color:var(--text-dim);margin-top:2px}

  /* MAIN */
  .main{flex:1;padding:20px 24px;max-width:960px}
  .feed-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .feed-title{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase}
  .sort-tabs{display:flex;gap:4px}
  .sort-tab{font-size:11px;padding:4px 10px;border-radius:4px;cursor:pointer;font-family:'Space Mono',monospace;border:1px solid transparent;color:var(--text-muted);transition:all .15s}
  .sort-tab.active{border-color:var(--border);background:var(--surface2);color:var(--text)}

  /* FILTER NOTICE */
  .filter-notice{background:rgba(224,82,82,.06);border:1px solid rgba(224,82,82,.15);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:8px}

  /* NEWS CARDS */
  .news-list{display:flex;flex-direction:column;gap:10px}

  /* ── 카드 공통 ── */
  .news-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .18s;position:relative;animation:fadeUp .3s ease both;text-decoration:none;display:block;color:inherit}
  .news-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border);transition:background .15s;z-index:1}
  .news-card:hover{border-color:#2a3040;background:var(--surface2)}
  .news-card:hover::before{background:var(--gold)}
  .news-card.highlight{border-color:rgba(200,168,75,.3);background:linear-gradient(135deg,rgba(200,168,75,.04) 0%,var(--surface) 60%)}
  .news-card.highlight::before{background:var(--gold)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* ── 카드 내부 레이아웃: 썸네일 오른쪽 ── */
  .card-inner{display:flex;gap:0;min-height:0}
  .card-body{flex:1;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:6px}
  .card-thumb{width:140px;flex-shrink:0;position:relative;overflow:hidden;background:var(--surface2)}
  .card-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
  .news-card:hover .card-thumb img{transform:scale(1.04)}
  .card-thumb-placeholder{width:100%;height:100%;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--surface2)}
  .placeholder-logo{font-size:11px;font-family:'Space Mono',monospace;color:var(--text-muted);letter-spacing:.04em;text-align:center;padding:0 8px;line-height:1.4}
  .placeholder-icon{font-size:22px;opacity:.4}

  /* ── 카드 메타 ── */
  .card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .card-source{font-family:'Space Mono',monospace;font-size:10px;color:var(--gold);letter-spacing:.06em;background:rgba(200,168,75,.1);padding:2px 7px;border-radius:3px}
  .card-time{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-muted)}
  .card-tags{display:flex;gap:4px;flex-wrap:wrap}
  .card-tag{font-size:10px;padding:2px 7px;border-radius:3px;background:var(--tag-bg);color:var(--text-dim);border:1px solid var(--border)}
  .card-tag.dubai{color:#4a9eff;border-color:rgba(74,158,255,.25);background:rgba(74,158,255,.07)}
  .card-tag.abudhabi{color:#a78bfa;border-color:rgba(167,139,250,.25);background:rgba(167,139,250,.07)}
  .card-tag.uae{color:var(--gold);border-color:rgba(200,168,75,.25);background:rgba(200,168,75,.07)}
  .card-tag.economy{color:var(--green);border-color:rgba(76,175,125,.25);background:rgba(76,175,125,.07)}
  .card-title{font-size:14px;font-weight:600;line-height:1.5;color:var(--text)}
  .card-desc{font-size:12px;color:var(--text-dim);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
  .card-link{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-muted);text-decoration:none}
  .card-actions{display:flex;gap:6px}
  .card-action-btn{font-size:11px;color:var(--text-muted);cursor:pointer;padding:2px 8px;border-radius:4px;border:1px solid transparent;transition:all .15s;background:none}
  .card-action-btn:hover{border-color:var(--border);color:var(--text)}
  .card-action-btn.hide:hover{color:var(--red);border-color:rgba(224,82,82,.3)}

  /* ── 독창성 배지 ── */
  .orig-badge{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:3px;text-transform:uppercase}
  .orig-badge.exclusive{background:rgba(245,158,66,.18);color:#f59e42;border:1px solid rgba(245,158,66,.4)}
  .orig-badge.original{background:rgba(76,175,125,.15);color:var(--green);border:1px solid rgba(76,175,125,.35)}

  /* ── 그룹 카드 ── */
  .group-card{padding-bottom:0}
  .group-lead-link{display:block;text-decoration:none;color:inherit}
  .dupe-toggle{background:none;border:none;cursor:pointer;font-size:11px;color:var(--text-muted);font-family:'Noto Sans KR',sans-serif;padding:0;text-align:left;transition:color .15s;max-width:380px;line-height:1.5}
  .dupe-toggle:hover{color:var(--text-dim)}
  .group-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px}
  .dupe-list{border-top:1px solid var(--border);background:rgba(0,0,0,.2)}
  .dupe-item{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid rgba(30,37,48,.6);text-decoration:none;color:inherit;transition:background .1s}
  .dupe-item:last-child{border-bottom:none}
  .dupe-item:hover{background:rgba(255,255,255,.02)}
  .dupe-source{font-family:'Space Mono',monospace;font-size:9px;color:var(--text-muted);white-space:nowrap;min-width:70px}
  .dupe-title{font-size:12px;color:var(--text-dim);flex:1;line-height:1.4;transition:color .15s}
  .dupe-item:hover .dupe-title{color:var(--text)}
  .dupe-time{font-family:'Space Mono',monospace;font-size:9px;color:var(--text-muted);white-space:nowrap}

  /* ── 로딩 ── */
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px}
  .loading-spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-family:'Space Mono',monospace;font-size:12px;color:var(--text-muted)}
  .empty{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:13px}

  /* ── API 설정 배너 ── */
  .api-banner{background:rgba(200,168,75,.07);border:1px solid rgba(200,168,75,.2);border-radius:10px;padding:20px 24px;margin-bottom:16px}
  .api-banner h3{color:var(--gold);font-size:14px;margin-bottom:10px}
  .api-banner p{font-size:12px;color:var(--text-dim);line-height:1.7;margin-bottom:10px}
  .api-key-row{display:flex;gap:8px;margin-bottom:8px}
  .api-key-input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 12px;font-size:12px;font-family:'Space Mono',monospace;outline:none}
  .api-key-input:focus{border-color:var(--gold-dim)}
  .api-save-btn{background:var(--gold);color:var(--bg);border:none;border-radius:6px;padding:7px 16px;font-size:12px;cursor:pointer;font-weight:700;white-space:nowrap}
  .api-demo-btn{background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);border-radius:6px;padding:7px 16px;font-size:12px;cursor:pointer}
  .api-demo-btn:hover{border-color:var(--border);color:var(--text)}

  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">🇦🇪</div>
    <div>
      <div class="logo-text">UAE BRIEFING</div>
      <div class="logo-sub">두바이 · 아부다비 · UAE</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="badge-live" id="livebadge" style="display:none">LIVE</span>
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="refresh-btn" onclick="loadNews()">↻ 새로고침</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">📡 검색 키워드</div>
      <div class="keyword-list" id="keywordList"></div>
      <div class="add-row">
        <input class="add-input" id="newKeyword" placeholder="키워드 추가..." onkeydown="if(event.key==='Enter')addKeyword()">
        <button class="add-btn" onclick="addKeyword()">+</button>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">🚫 제외 키워드</div>
      <div class="filter-list" id="filterList"></div>
      <div class="add-row">
        <input class="add-input" id="newFilter" placeholder="제외할 단어..." onkeydown="if(event.key==='Enter')addFilter()">
        <button class="add-btn" style="background:var(--red)" onclick="addFilter()">+</button>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">📊 현황</div>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-num">—</div><div class="stat-label">전체 기사</div></div>
        <div class="stat-card"><div class="stat-num" style="color:var(--red)">—</div><div class="stat-label">필터됨</div></div>
        <div class="stat-card"><div class="stat-num" style="color:#f59e42">—</div><div class="stat-label">단독</div></div>
        <div class="stat-card"><div class="stat-num" style="color:var(--green)">—</div><div class="stat-label">심층</div></div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="feed-header">
      <div class="feed-title">뉴스 피드</div>
      <div class="sort-tabs">
        <div class="sort-tab active" onclick="setSort(this,'latest')">최신순</div>
        <div class="sort-tab" onclick="setSort(this,'group')">묶음순</div>
      </div>
    </div>
    <div id="filterNotice" class="filter-notice" style="display:none"></div>
    <div class="news-list" id="newsList">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">뉴스 불러오는 중...</div>
      </div>
    </div>
  </div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
// Vercel 배포 후 자동으로 /api/news 를 호출합니다.
// 로컬 테스트 시: DEMO_MODE = true 로 샘플 데이터를 씁니다.
const API_BASE   = '/api/news';
const DEMO_MODE  = !window.location.hostname.includes('vercel.app')
                && !window.location.hostname.includes('localhost');

// ── STATE ──────────────────────────────────────────────────────────────────
let state = {
  keywords: ['두바이','아부다비','UAE'],
  filters:  ['축구','스포츠','골프'],
  activeKeyword: null,
  sort: 'latest',
  hidden: new Set(),
  expandedGroups: new Set(),
  data: null   // last API response
};

// ── DEMO DATA ──────────────────────────────────────────────────────────────
const DEMO = {
  groups:[
    { id:'g0', lead:{ title:'[단독] 아부다비 ADNOC, 한국 조선사에 LNG선 10척 발주… 25억 달러',
        description:'아부다비 국영석유회사 ADNOC이 HD현대와 삼성중공업에 LNG운반선 10척을 발주했다. 총 계약금액 25억 달러로 국내 조선업 역대 단일 최대 중동 수주다. 본지가 단독으로 계약서 내용을 입수해 세부 조건을 확인했다.',
        source:'chosun.com', time:'10분 전', keyword:'아부다비', originality:'exclusive',
        link:'https://search.naver.com/search.naver?where=news&query=ADNOC+LNG+조선',
        thumbnail:'https://images.unsplash.com/photo-1605745341112-85968b19335b?w=280&q=80' },
      others:[
        { title:'ADNOC, 한국 HD현대·삼성중공업과 LNG선 계약', source:'yna.co.kr', time:'35분 전', link:'https://search.naver.com/search.naver?where=news&query=ADNOC+LNG' },
        { title:'삼성중공업·HD현대, 아부다비서 LNG선 수주 쾌거', source:'hankyung.com', time:'50분 전', link:'https://search.naver.com/search.naver?where=news&query=삼성중공업+ADNOC' },
        { title:'K-조선, 중동서 또 대박… ADNOC 25억弗 수주', source:'mk.co.kr', time:'1시간 전', link:'https://search.naver.com/search.naver?where=news&query=K조선+ADNOC' },
      ]
    },
    { id:'g1', lead:{ title:'\'두바이로 가는 한국 프리랜서들\'… UAE 신비자, 실제로 써봤더니',
        description:'UAE 장기비자 제도를 실제 취득한 한국인 4명을 인터뷰했다. 서류 준비부터 거주증 발급까지 4주 소요됐고 예상보다 까다로운 소득 증빙이 걸림돌이었다. 전문가들은 세금·연금 공백 문제도 꼼꼼히 살펴야 한다고 조언한다.',
        source:'hani.co.kr', time:'45분 전', keyword:'UAE', originality:'original',
        link:'https://search.naver.com/search.naver?where=news&query=UAE+비자+프리랜서',
        thumbnail:'https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=280&q=80' },
      others:[
        { title:'UAE 비자 전면 개편… 프리랜서·유튜버도 5년 장기비자', source:'sedaily.com', time:'20분 전', link:'https://search.naver.com/search.naver?where=news&query=UAE+비자+개편' },
        { title:'UAE, 디지털노마드 비자 요건 완화… 한국인 신청 늘 듯', source:'newsis.com', time:'1시간 30분 전', link:'https://search.naver.com/search.naver?where=news&query=UAE+디지털노마드+비자' },
      ]
    },
    { id:'g2', lead:{ title:'에미레이트항공, 인천 노선 증편 신청… 주 21→28편',
        description:'에미레이트항공이 인천-두바이 노선을 주 28편으로 늘려달라고 국토부에 공식 요청했다. 한국 노선 수요가 급증해 현재 좌석이 부족한 상황이다. 슬롯 협의가 타결되면 내년 하계 스케줄부터 반영된다.',
        source:'yonhapnewstv.co.kr', time:'30분 전', keyword:'UAE', originality:'pr',
        link:'https://search.naver.com/search.naver?where=news&query=에미레이트항공+인천+증편',
        thumbnail:'https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=280&q=80' },
      others:[
        { title:'에미레이트항공 인천 노선 증편 추진… 슬롯 확보가 관건', source:'biz.chosun.com', time:'55분 전', link:'https://search.naver.com/search.naver?where=news&query=에미레이트+인천+슬롯' },

        { title:'항공편 늘리면 두바이 여행 더 싸질까… 소비자 기대감', source:'mt.co.kr', time:'1시간 40분 전', link:'https://search.naver.com/search.naver?where=news&query=에미레이트+증편+두바이여행' },

        source:'mk.co.kr', time:'5분 전', keyword:'두바이', originality:'original',
        link:'https://search.naver.com/search.naver?where=news&query=두바이+엑스포시티+스타트업',
        thumbnail:'https://images.unsplash.com/photo-1518684079-3c830dcef090?w=280&q=80' },
      others:[]
    },
    { id:'g4', lead:{ title:'아부다비 루브르 박물관, 한국 특별전 2026년 봄 개최 확정',

        source:'hani.co.kr', time:'3시간 전', keyword:'아부다비', originality:'original',
        link:'https://search.naver.com/search.naver?where=news&query=아부다비+루브르+한국특별전',
        thumbnail:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=280&q=80' },
      others:[]
    },
    { id:'g5', lead:{ title:'두바이 부동산 3년 연속 두 자릿수 상승… 한인 \'묻지마 투자\' 경고',
        description:'두바이 부동산 가격이 3년 연속 두 자릿수 상승하며 과열 우려가 커지고 있다. 전문가들은 한국 투자자들에게 신중한 접근을 당부한다. 일부 단지는 분양가 대비 40% 이상 프리미엄이 붙어 거래 중이다.',
        source:'news1.kr', time:'1시간 25분 전', keyword:'두바이', originality:'original',
        link:'https://search.naver.com/search.naver?where=news&query=두바이+부동산+과열',
        thumbnail:'https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=280&q=80' },
      others:[]
    },
  ],
  filteredCount:2,
  filteredReasons:['축구'],
  total:17,
  fetchedAt: new Date().toISOString()
};

// ── API CALL ───────────────────────────────────────────────────────────────
async function loadNews() {
  const btn = document.querySelector('.refresh-btn');
  btn.textContent = '↻ 불러오는 중...';
  document.getElementById('newsList').innerHTML =
    `<div class="loading"><div class="loading-spinner"></div><div class="loading-text">뉴스 불러오는 중...</div></div>`;

  try {
    let data;
    if (DEMO_MODE) {
      await new Promise(r => setTimeout(r, 900)); // 로딩 느낌
      data = DEMO;
    } else {
      const params = new URLSearchParams({
        keywords: state.keywords.join(','),
        filters:  state.filters.join(',')
      });
      const res = await fetch(`${API_BASE}?${params}`);
      if (!res.ok) throw new Error(await res.text());
      data = await res.json();
    }
    state.data = data;
    const d = new Date(data.fetchedAt);
    document.getElementById('lastUpdated').textContent =
      `업데이트 ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    document.getElementById('livebage') && (document.getElementById('livebage').style.display='');
    document.getElementById('livebage') || (document.getElementById('livebage') && (document.getElementById('livebage').style.display='inline-flex'));
  } catch(e) {
    state.data = DEMO; // fallback
    console.warn('API 오류, 데모 데이터 사용:', e);
  }

  btn.textContent = '↻ 새로고침';
  render();
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function render() {
  renderKeywords();
  renderFilters();
  renderFeed();
  renderStats();
}

function renderKeywords() {
  const data = state.data;
  const counts = {};
  if (data) {
    data.groups.forEach(g => {
      const kw = g.lead.keyword;
      counts[kw] = (counts[kw]||0) + 1 + g.others.length;
    });
  }
  document.getElementById('keywordList').innerHTML = state.keywords.map(kw => `
    <div class="keyword-item ${state.activeKeyword===kw?'active':''}" onclick="toggleKeyword('${kw}')">
      <span>${kw}</span>
      <span class="keyword-count">${counts[kw]||0}</span>
    </div>`).join('');
}

function renderFilters() {
  document.getElementById('filterList').innerHTML = state.filters.map(f => `
    <div class="filter-item">
      <span>${f}</span>
      <span class="filter-remove" onclick="removeFilter('${f}')">×</span>
    </div>`).join('');
}

function renderFeed() {
  const list   = document.getElementById('newsList');
  const notice = document.getElementById('filterNotice');
  const data   = state.data;
  if (!data) return;

  // filter notice
  if (data.filteredCount > 0) {
    notice.style.display = 'flex';
    notice.innerHTML = `🚫 제외 키워드(${data.filteredReasons.join(', ')})로 <strong style="color:var(--red);margin:0 3px">${data.filteredCount}건</strong> 필터링됨`;
  } else { notice.style.display = 'none'; }

  let groups = data.groups.filter(g => !state.hidden.has(g.id));
  if (state.activeKeyword) groups = groups.filter(g => g.lead.keyword === state.activeKeyword);

  if (groups.length === 0) { list.innerHTML = `<div class="empty">조건에 맞는 뉴스가 없습니다</div>`; return; }

  list.innerHTML = groups.map((g, i) => renderCard(g, i)).join('');
}

function renderCard(g, i) {
  const lead = g.lead;
  const isGroup = g.others.length > 0;
  const isExpanded = state.expandedGroups.has(g.id);
  const highlight = lead.originality === 'exclusive' || lead.originality === 'original';
  const badge = lead.originality === 'exclusive'
    ? `<span class="orig-badge exclusive">단독</span>`
    : lead.originality === 'original'
    ? `<span class="orig-badge original">심층</span>`
    : '';

  const thumbHtml = lead.thumbnail
    ? `<img src="${lead.thumbnail}" alt="" loading="lazy" onerror="this.parentElement.innerHTML=fallbackThumb('${escHtml(lead.source)}')">`
    : fallbackThumb(lead.source);

  const dupeRows = g.others.map(n => `
    <a class="dupe-item" href="${n.link}" target="_blank" rel="noopener noreferrer">
      <span class="dupe-source">${escHtml(n.source)}</span>
      <span class="dupe-title">${escHtml(n.title)}</span>
      <span class="dupe-time">${n.time||''}</span>
    </a>`).join('');

  const otherSources = g.others.map(n=>n.source).join(', ');

  return `
  <div class="news-card ${isGroup?'group-card':''} ${highlight?'highlight':''}" style="animation-delay:${i*40}ms" id="card-${g.id}">
    <a class="group-lead-link" href="${lead.link}" target="_blank" rel="noopener noreferrer">
      <div class="card-inner">
        <div class="card-body">
          <div class="card-meta">
            ${badge}
            <span class="card-source">${escHtml(lead.source)}</span>
            <span class="card-time">${lead.time||pubDateToRelative(lead.pubDate)}</span>
            <div class="card-tags">${tagsFor(lead.keyword)}</div>
          </div>
          <div class="card-title">${escHtml(lead.title.replace(/\[단독\]\s*/,''))}</div>
          <div class="card-desc">${escHtml(lead.description)}</div>
          <div class="card-footer">
            <span class="card-link">네이버 뉴스에서 보기 →</span>
          </div>
        </div>
        <div class="card-thumb">${thumbHtml}</div>
      </div>
    </a>
    <div class="${isGroup?'group-footer':'card-actions-row'}" style="${isGroup?'':'padding:0 16px 12px;display:flex;justify-content:flex-end;gap:6px'}">
      ${isGroup ? `
        <button class="dupe-toggle" onclick="toggleGroup('${g.id}',event)">
          ${isExpanded
            ? '▲ 접기'
            : `▼ <span style="color:var(--text-dim)">${escHtml(lead.source)}</span> 외 <strong style="color:var(--gold)">${g.others.length}건</strong> — ${escHtml(otherSources)}`}
        </button>
        <div class="card-actions">
          <button class="card-action-btn hide" onclick="hideCard('${g.id}',event)">숨기기</button>
          <button class="card-action-btn" onclick="copyTitle('${escAttr(lead.title)}',event)">복사</button>
        </div>
      ` : `
        <button class="card-action-btn hide" onclick="hideCard('${g.id}',event)">숨기기</button>
        <button class="card-action-btn" onclick="copyTitle('${escAttr(lead.title)}',event)">복사</button>
      `}
    </div>
    ${isExpanded ? `<div class="dupe-list">${dupeRows}</div>` : ''}
  </div>`;
}

function fallbackThumb(source) {
  const short = (source||'').replace(/\.(co\.kr|com|kr|net)$/,'').split('.').pop().toUpperCase().slice(0,6);
  const colors = ['#1e2a3a','#1a2438','#1c2535','#1e2230'];
  const c = colors[short.charCodeAt(0)%colors.length];
  return `<div class="card-thumb-placeholder" style="background:${c}">
    <span class="placeholder-icon">📰</span>
    <span class="placeholder-logo">${short}</span>
  </div>`;
}

function tagsFor(keyword) {
  const map = { '두바이':'dubai','아부다비':'abudhabi','UAE':'uae' };
  const cls = map[keyword]||'';
  return `<span class="card-tag ${cls}">${keyword}</span>`;
}

function pubDateToRelative(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr), now = new Date();
  const diff = Math.floor((now-d)/60000);
  if (diff < 1)  return '방금 전';
  if (diff < 60) return `${diff}분 전`;
  const h = Math.floor(diff/60);
  if (h < 24)    return `${h}시간 전`;
  return `${Math.floor(h/24)}일 전`;
}

function renderStats() {
  const data = state.data;
  if (!data) return;
  const exclusive = data.groups.filter(g=>g.lead.originality==='exclusive').length;
  const original  = data.groups.filter(g=>g.lead.originality==='original').length;
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-num">${data.total||data.groups.length}</div><div class="stat-label">전체 기사</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--red)">${data.filteredCount}</div><div class="stat-label">필터됨</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#f59e42">${exclusive}</div><div class="stat-label">단독</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green)">${original}</div><div class="stat-label">심층</div></div>`;
}

// ── ACTIONS ────────────────────────────────────────────────────────────────
function toggleKeyword(kw) {
  state.activeKeyword = state.activeKeyword===kw ? null : kw; render();
}
function toggleGroup(gid, e) {
  e.stopPropagation(); e.preventDefault();
  state.expandedGroups.has(gid) ? state.expandedGroups.delete(gid) : state.expandedGroups.add(gid);
  render();
}
function hideCard(gid, e) {
  e.stopPropagation(); e.preventDefault();
  state.hidden.add(gid); render();
}
function copyTitle(title, e) {
  e.stopPropagation(); e.preventDefault();
  navigator.clipboard.writeText(title).catch(()=>{});
  const btn = e.target; btn.textContent='복사됨!';
  setTimeout(()=>btn.textContent='복사',1200);
}
function addKeyword() {
  const i=document.getElementById('newKeyword'), v=i.value.trim();
  if(v&&!state.keywords.includes(v)){state.keywords.push(v);i.value='';loadNews();}
}
function addFilter() {
  const i=document.getElementById('newFilter'), v=i.value.trim();
  if(v&&!state.filters.includes(v)){state.filters.push(v);i.value='';if(state.data)render();}
}
function removeFilter(f) {
  state.filters=state.filters.filter(x=>x!==f); if(state.data)render();
}
function setSort(el,sort) {
  document.querySelectorAll('.sort-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active'); state.sort=sort; render();
}

// ── ESCAPE HELPERS ────────────────────────────────────────────────────────
function escHtml(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escAttr(s=''){return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;')}

// ── INIT ──────────────────────────────────────────────────────────────────
loadNews();
</script>
</body>
</html>
