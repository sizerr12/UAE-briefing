<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAE 뉴스 브리핑</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--surface2:#f0f1f4;
  --border:#e2e5ea;--gold:#b8860b;--gold-dim:#d4a017;
  --text:#1a1d23;--text-dim:#5a6070;--text-muted:#9aa0ac;
  --red:#d63031;--green:#00875a;--blue:#0052cc;--tag-bg:#eef0f5;
  --heart:#e84393;--orange:#d97706;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ════════════════════════════════════════
   🔒 LOCK SCREEN
════════════════════════════════════════ */
#lockScreen{
  display:none;position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,#f0f4ff 0%,#fafbff 100%);
  align-items:center;justify-content:center;flex-direction:column;gap:20px;
}
#lockScreen.show{display:flex}
.lock-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:40px 44px;width:360px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.12)}
.lock-icon{font-size:40px;margin-bottom:10px}
.lock-title{font-family:'Space Mono',monospace;font-size:15px;color:var(--text);letter-spacing:.06em;margin-bottom:4px;font-weight:700}
.lock-sub{font-size:12px;color:var(--text-muted);margin-bottom:22px}
.lock-input{width:100%;background:var(--bg);border:1.5px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px 14px;font-size:15px;text-align:center;
  letter-spacing:.25em;outline:none;font-family:'Space Mono',monospace;transition:border-color .2s}
.lock-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,82,204,.1)}
.lock-btn{width:100%;margin-top:12px;background:var(--blue);color:#fff;border:none;
  border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;
  transition:all .2s;letter-spacing:.02em}
.lock-btn:hover{background:#0047b3;box-shadow:0 4px 12px rgba(0,82,204,.3)}
.lock-error{font-size:12px;color:var(--red);margin-top:8px;min-height:18px}
.lock-loading{display:flex;align-items:center;gap:8px;margin-top:12px;
  font-size:12px;color:var(--text-muted);justify-content:center}
.google-login-btn{width:100%;margin-top:4px;background:#fff;color:#3c4043;
  border:1px solid #dadce0;border-radius:10px;padding:12px 16px;
  font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.08)}
.google-login-btn:hover{background:#f8f9fa;box-shadow:0 2px 8px rgba(0,0,0,.12);border-color:#c6c6c6}
.google-login-btn:active{background:#f1f3f4}
.user-chip{display:flex;align-items:center;gap:6px;background:var(--surface2);
  border:1px solid var(--border);border-radius:20px;padding:3px 4px 3px 8px}
.user-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover}
.user-name{font-size:12px;color:var(--text-dim);max-width:100px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ════════════════════════════════════════
   TOP BAR
════════════════════════════════════════ */
.topbar{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:9px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.08em}
.logo-icon{width:28px;height:28px;background:linear-gradient(135deg,#0052cc,#0078d4);
  border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.logo-text{color:var(--text);font-weight:700}.logo-sub{color:var(--text-muted);font-size:10px}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);
  padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;
  font-family:'Space Mono',monospace;transition:all .2s}
.topbar-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(0,82,204,.05)}
.topbar-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(0,82,204,.08)}
.badge-live{display:inline-flex;align-items:center;gap:4px;font-family:'Space Mono',monospace;
  font-size:10px;color:var(--green);background:rgba(0,135,90,.08);
  border:1px solid rgba(0,135,90,.2);padding:3px 8px;border-radius:4px}
.badge-live::before{content:'';width:5px;height:5px;border-radius:50%;
  background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.last-updated{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-muted)}

/* ════════════════════════════════════════
   LAYOUT
════════════════════════════════════════ */
.layout{display:flex;margin-top:52px;min-height:calc(100vh - 52px)}

/* ════════════════════════════════════════
   SIDEBAR
════════════════════════════════════════ */
.sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  padding:16px 12px;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto}
.sidebar-section{margin-bottom:20px}
.sidebar-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.14em;
  color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;padding:0 4px}

/* 뷰 필터 아이템 */
.nav-item{display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px;
  transition:all .12s;color:var(--text-dim);border:1px solid transparent}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(0,82,204,.07);border-color:rgba(0,82,204,.15);color:var(--blue);font-weight:600}
.nav-item-left{display:flex;align-items:center;gap:8px}
.nav-icon{font-size:14px;width:20px;text-align:center}
.nav-count{font-family:'Space Mono',monospace;font-size:10px;
  background:var(--tag-bg);color:var(--text-muted);padding:1px 6px;border-radius:3px;min-width:22px;text-align:center}
.nav-item.active .nav-count{background:rgba(0,82,204,.1);color:var(--blue)}

.nav-divider{height:1px;background:var(--border);margin:8px 4px}

/* 키워드/필터 */
.keyword-list{display:flex;flex-direction:column;gap:3px}
.keyword-item{display:flex;align-items:center;justify-content:space-between;
  background:var(--surface2);border:1px solid var(--border);border-radius:6px;
  padding:6px 10px;font-size:12px;cursor:pointer;transition:all .12s;color:var(--text-dim)}
.keyword-item:hover{border-color:var(--blue);color:var(--text)}
.keyword-item.active{border-color:var(--blue);background:rgba(0,82,204,.06);color:var(--blue);font-weight:600}
.keyword-count{font-family:'Space Mono',monospace;font-size:10px;color:var(--blue);
  background:rgba(0,82,204,.1);padding:1px 5px;border-radius:3px}
.filter-list{display:flex;flex-direction:column;gap:3px}
.filter-item{display:flex;align-items:center;justify-content:space-between;
  background:rgba(214,48,49,.04);border:1px solid rgba(214,48,49,.15);
  border-radius:6px;padding:6px 10px;font-size:12px;color:var(--text-dim)}
.filter-remove{color:var(--red);cursor:pointer;font-size:15px;opacity:.5;transition:opacity .15s}
.filter-remove:hover{opacity:1}
.add-row{display:flex;gap:5px;margin-top:6px}
.add-input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:5px 9px;font-size:11px;font-family:'Noto Sans KR',sans-serif;
  outline:none;transition:border-color .15s}
.add-input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,82,204,.1)}
.add-btn{background:var(--blue);color:#fff;border:none;border-radius:6px;
  padding:5px 9px;font-size:12px;cursor:pointer;font-weight:700;transition:opacity .15s}
.add-btn:hover{opacity:.85}

/* 통계 */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;box-shadow:var(--shadow)}
.stat-num{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--text)}
.stat-label{font-size:10px;color:var(--text-muted);margin-top:1px}

/* ════════════════════════════════════════
   MAIN
════════════════════════════════════════ */
.main{flex:1;padding:20px 24px;max-width:980px}
.feed-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.feed-title{font-size:13px;color:var(--text-dim)}
.feed-title strong{color:var(--text);font-weight:700}
.view-controls{display:flex;gap:6px;align-items:center}
.view-btn{font-size:12px;padding:4px 10px;border-radius:5px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
  transition:all .15s;font-family:'Space Mono',monospace;box-shadow:var(--shadow)}
.view-btn.active{border-color:var(--blue);background:rgba(0,82,204,.07);color:var(--blue)}
.sort-tab{font-size:11px;padding:4px 10px;border-radius:4px;cursor:pointer;
  font-family:'Space Mono',monospace;border:1px solid var(--border);
  background:var(--surface);color:var(--text-muted);transition:all .15s;box-shadow:var(--shadow)}
.sort-tab.active{border-color:var(--blue);background:rgba(0,82,204,.07);color:var(--blue);font-weight:600}
.select-mode-btn{font-size:11px;padding:4px 10px;border-radius:5px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-muted);cursor:pointer;transition:all .15s;
  font-family:'Space Mono',monospace;box-shadow:var(--shadow)}
.select-mode-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(0,82,204,.07)}

.mark-all-btn{font-size:11px;padding:4px 12px;border-radius:5px;border:1px solid rgba(0,135,90,.3);
  background:rgba(0,135,90,.07);color:var(--green);cursor:pointer;transition:all .2s;
  font-family:'Space Mono',monospace;font-weight:700}
.mark-all-btn:hover{background:rgba(0,135,90,.14);border-color:var(--green);box-shadow:0 1px 4px rgba(0,135,90,.15)}
.mark-all-btn:active{transform:scale(.97)}

.filter-notice{background:rgba(214,48,49,.05);border:1px solid rgba(214,48,49,.15);
  border-radius:8px;padding:8px 14px;margin-bottom:12px;font-size:12px;
  color:var(--text-dim);display:flex;align-items:center;gap:8px}

/* ════════════════════════════════════════
   CARD VIEW
════════════════════════════════════════ */
.news-list{display:flex;flex-direction:column;gap:10px}
.news-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;transition:all .15s;position:relative;
  animation:fadeUp .25s ease both;color:inherit;box-shadow:var(--shadow)}
.news-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--border);transition:background .15s;z-index:1}
.news-card:hover{border-color:#c8d0e0;box-shadow:var(--shadow-md);transform:translateY(-1px)}
.news-card:hover::before{background:var(--blue)}
.news-card.highlight{border-color:rgba(217,119,6,.25);
  background:linear-gradient(135deg,rgba(217,119,6,.03) 0%,var(--surface) 60%)}
.news-card.highlight::before{background:var(--orange)}
.news-card.read{opacity:.45;filter:saturate(.2)}
.news-card.read:hover{opacity:.7;filter:saturate(.5)}
.news-card.read .card-title{color:var(--text-dim)}
.news-card.selected{border-color:rgba(0,82,204,.35);background:rgba(0,82,204,.03)}
.news-card.selected::before{background:var(--blue)}
.news-card.focused{outline:2px solid var(--blue);outline-offset:1px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* 카드 내부 */
.card-inner{display:flex;min-height:0}
.card-body{flex:1;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:5px}
.card-thumb{width:130px;flex-shrink:0;overflow:hidden;background:var(--surface2)}
.card-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.news-card:hover .card-thumb img{transform:scale(1.04)}

/* ─ 중요도 별점 ─ */
.importance-stars{display:flex;gap:1px;align-items:center}
.star{font-size:10px;line-height:1}
.star.on{color:var(--orange)}
.star.off{color:var(--border);opacity:.8}

/* ─ 읽음 dot ─ */
.read-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);
  flex-shrink:0;transition:all .2s}
.news-card.read .read-dot{background:var(--border)}

/* ─ 소스 ─ */
.source-row{display:flex;align-items:center;gap:6px}
.source-favicon{width:13px;height:13px;border-radius:2px;object-fit:contain;opacity:.85}
.card-source{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-dim);font-weight:700}
.card-time{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-muted)}

.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-tags{display:flex;gap:3px;margin-left:auto}
.card-tag{font-size:9px;padding:2px 7px;border-radius:4px;background:var(--surface2);
  color:var(--text-muted);border:1px solid var(--border);font-weight:500}
.card-tag.dubai{color:#0052cc;border-color:rgba(0,82,204,.2);background:rgba(0,82,204,.06)}
.card-tag.abudhabi{color:#6e40c9;border-color:rgba(110,64,201,.2);background:rgba(110,64,201,.06)}
.card-tag.uae{color:var(--orange);border-color:rgba(217,119,6,.2);background:rgba(217,119,6,.06)}
.card-title{font-size:14px;font-weight:700;line-height:1.55;color:var(--text)}
.card-desc{font-size:12px;color:var(--text-dim);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;align-items:center;justify-content:space-between;
  margin-top:auto;padding-top:8px}
.card-link{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-muted)}
.card-link:hover{color:var(--blue)}
.card-actions{display:flex;gap:3px;align-items:center}
.card-action-btn{font-size:11px;color:var(--text-muted);cursor:pointer;padding:3px 8px;
  border-radius:5px;border:1px solid transparent;transition:all .15s;background:none;
  font-family:'Noto Sans KR',sans-serif}
.card-action-btn:hover{border-color:var(--border);background:var(--surface2);color:var(--text)}
.card-action-btn.danger:hover{color:var(--red);border-color:rgba(214,48,49,.2);background:rgba(214,48,49,.05)}
.heart-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:2px 5px;
  border-radius:4px;transition:all .15s;color:var(--text-muted)}
.heart-btn:hover{color:var(--heart);transform:scale(1.2)}
.heart-btn.liked{color:var(--heart)}

/* ─ 배지 ─ */
.orig-badge{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:.06em;padding:2px 7px;border-radius:4px}
.orig-badge.exclusive{background:rgba(214,48,49,.08);color:#c0392b;border:1px solid rgba(214,48,49,.25)}
.orig-badge.original{background:rgba(0,135,90,.08);color:var(--green);border:1px solid rgba(0,135,90,.25)}

/* ─ 체크박스 ─ */
.card-checkbox{position:absolute;top:12px;left:11px;z-index:10;width:17px;height:17px;
  border-radius:4px;border:1.5px solid var(--border);background:var(--surface);
  cursor:pointer;display:none;appearance:none;-webkit-appearance:none;transition:all .15s}
.card-checkbox:checked{background:var(--blue);border-color:var(--blue);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 10 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 4l3 3 5-6' stroke='white' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-size:10px;background-repeat:no-repeat;background-position:center}
.select-mode .card-checkbox{display:block}

/* ─ 그룹 ─ */
.group-card{padding-bottom:0}
.group-lead-link{display:block;text-decoration:none;color:inherit}
.dupe-toggle{background:none;border:none;cursor:pointer;font-size:11px;
  color:var(--text-muted);font-family:'Noto Sans KR',sans-serif;padding:0;line-height:1.5;transition:color .15s}
.dupe-toggle:hover{color:var(--blue)}
.group-footer{display:flex;align-items:center;justify-content:space-between;padding:7px 16px 10px}
.dupe-list{border-top:1px solid var(--border);background:var(--bg)}
.dupe-item{display:flex;align-items:center;gap:8px;padding:7px 16px;
  border-bottom:1px solid var(--border);text-decoration:none;color:inherit;transition:background .1s}
.dupe-item:last-child{border-bottom:none}
.dupe-item:hover{background:var(--surface2)}
.dupe-src-wrap{display:flex;align-items:center;gap:4px;min-width:80px}
.dupe-favicon{width:11px;height:11px;border-radius:2px;opacity:.7}
.dupe-source{font-family:'Space Mono',monospace;font-size:9px;color:var(--text-muted)}
.dupe-title{font-size:12px;color:var(--text-dim);flex:1;line-height:1.4;transition:color .1s}
.dupe-item:hover .dupe-title{color:var(--text)}
.dupe-time{font-family:'Space Mono',monospace;font-size:9px;color:var(--text-muted);white-space:nowrap}

/* bookmark chips */
.bookmark-tags-on-card{display:flex;gap:3px;flex-wrap:wrap}
.btag-chip{font-size:9px;padding:2px 7px;border-radius:10px;
  background:rgba(0,82,204,.07);color:var(--blue);border:1px solid rgba(0,82,204,.15)}

/* ════════════════════════════════════════
   COMPACT LIST VIEW
════════════════════════════════════════ */
.news-list.compact-view{gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.news-list.compact-view .news-card{border:none;border-bottom:1px solid var(--border);
  border-radius:0;animation:none;box-shadow:none;transform:none}
.news-list.compact-view .news-card:last-child{border-bottom:none}
.news-list.compact-view .news-card::before{border-radius:0}
.news-list.compact-view .card-thumb{display:none}
.news-list.compact-view .card-body{padding:8px 16px;flex-direction:row;align-items:center;gap:10px}
.news-list.compact-view .card-desc{display:none}
.news-list.compact-view .card-title{font-size:13px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.news-list.compact-view .card-footer{padding-top:0;margin-top:0;flex-shrink:0}
.news-list.compact-view .card-meta{flex-shrink:0;flex-wrap:nowrap}
.news-list.compact-view .card-tags{display:none}
.news-list.compact-view .bookmark-tags-on-card{display:none}
.news-list.compact-view .group-footer{padding:4px 16px 6px}
.news-list.compact-view .dupe-list .dupe-item{padding:5px 16px}

/* ════════════════════════════════════════
   TAB BAR
════════════════════════════════════════ */
.tab-bar{display:flex;border-bottom:1px solid var(--border);margin-bottom:12px}
.tab-btn{padding:7px 16px;font-size:13px;cursor:pointer;border:none;background:none;
  color:var(--text-muted);border-bottom:2px solid transparent;transition:all .15s;
  font-family:'Noto Sans KR',sans-serif}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tab-count{font-family:'Space Mono',monospace;font-size:10px;background:rgba(0,82,204,.1);
  color:var(--blue);padding:1px 5px;border-radius:3px;margin-left:5px}

/* ════════════════════════════════════════
   TAG MODAL
════════════════════════════════════════ */
.modal-overlay{display:none;position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.35);backdrop-filter:blur(4px);align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:20px 22px;width:310px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px}
.modal-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;min-height:28px}
.modal-tag{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text-dim);cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:4px}
.modal-tag:hover{border-color:var(--blue);color:var(--text)}

<script type="module">
// ════════════════════════════════════════
// 🔥 FIREBASE CONFIG
// ════════════════════════════════════════
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAsunIijhP6Y49q9iuZ8P2vAR_A4llRENg",
  authDomain: "uae-briefing.firebaseapp.com",
  projectId: "uae-briefing",
  storageBucket: "uae-briefing.firebasestorage.app",
  messagingSenderId: "675050556668",
  appId: "1:675050556668:web:1bc5e9c38f4675c2af1b79"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// 허용된 이메일 목록 (여기에 요환님 + 와이프 구글 이메일 추가)
const ALLOWED_EMAILS = [
  'yoyohwan@gmail.com',
  'elise@leeumtax.com',
];

let currentUser = null;

// ── 로그인 상태 감지 ──
onAuthStateChanged(auth, async (user) => {
  if (user) {
    // 허용 목록 체크 (비어있으면 누구나 접속 가능)
    if (ALLOWED_EMAILS.length > 0 && !ALLOWED_EMAILS.includes(user.email)) {
      showLockError('접근 권한이 없습니다: ' + user.email);
      await fbSignOut(auth);
      return;
    }
    currentUser = user;
    // UI 업데이트
    document.getElementById('userAvatar').src = user.photoURL || '';
    document.getElementById('userName').textContent = user.displayName?.split(' ')[0] || user.email;
    showApp();
    await loadUserData();
    loadNews();
  } else {
    currentUser = null;
    showLock();
  }
});

function showApp() {
  document.getElementById('lockScreen').classList.remove('show');
  document.getElementById('appTopbar').style.display = '';
  document.getElementById('appLayout').style.display = '';
}
function showLock() {
  document.getElementById('lockScreen').classList.add('show');
  document.getElementById('appTopbar').style.display = 'none';
  document.getElementById('appLayout').style.display = 'none';
  document.getElementById('lockLoading').style.display = 'none';
}
function showLockError(msg) {
  document.getElementById('lockError').textContent = msg;
  setTimeout(() => document.getElementById('lockError').textContent = '', 3000);
}

async function signInWithGoogle() {
  const provider = new GoogleAuthProvider();
  document.getElementById('lockLoading').style.display = 'flex';
  document.querySelector('.google-login-btn').style.display = 'none';
  try {
    await signInWithPopup(auth, provider);
  } catch(e) {
    showLockError('로그인 실패. 다시 시도해주세요.');
    document.getElementById('lockLoading').style.display = 'none';
    document.querySelector('.google-login-btn').style.display = 'flex';
  }
}

async function signOut() {
  await fbSignOut(auth);
}

// ── Firestore: 유저 데이터 로드/저장 ──
async function loadUserData() {
  if (!currentUser) return;
  try {
    const ref = doc(db, 'users', currentUser.uid);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const d = snap.data();
      if (d.likes)   state.likes   = d.likes;
      if (d.tags)    state.tags    = d.tags;
      if (d.allTags) state.allTags = d.allTags;
      if (d.read)    state.read    = d.read;
      if (d.keywords) state.keywords = d.keywords;
      if (d.filters)  state.filters  = d.filters;
    }
  } catch(e) { console.warn('loadUserData:', e); }
}

async function saveToCloud() {
  if (!currentUser) { savePersist(); return; }
  try {
    const ref = doc(db, 'users', currentUser.uid);
    await setDoc(ref, {
      likes:    state.likes,
      tags:     state.tags,
      allTags:  state.allTags,
      read:     state.read,
      keywords: state.keywords,
      filters:  state.filters,
      updatedAt: serverTimestamp()
    }, { merge: true });
  } catch(e) {
    console.warn('saveToCloud:', e);
    savePersist(); // fallback
  }
}

// ════════════════════════════════════════
// HTML 디코딩
// ════════════════════════════════════════
function decodeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ')
    .replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(n))
    .replace(/<[^>]+>/g,'');
}

// ════════════════════════════════════════
// 링크 처리
// ════════════════════════════════════════
function naverNewsUrl(item) {
  if (!item) return '#';
  const link = item.naverLink || item.link || '';
  if (link.includes('n.news.naver.com') || link.includes('news.naver.com/')) return link;
  return item.originallink || item.link || '#';
}

// ════════════════════════════════════════
// 언론사
// ════════════════════════════════════════
const SOURCE_DISPLAY = {
  'chosun.com':'조선','donga.com':'동아','joongang.co.kr':'중앙',
  'hani.co.kr':'한겨레','khan.co.kr':'경향','mk.co.kr':'매일경제',
  'hankyung.com':'한국경제','sedaily.com':'서울경제','asiae.co.kr':'아시아경제',
  'mt.co.kr':'머니투데이','newsis.com':'뉴시스','news1.kr':'뉴스1',
  'yna.co.kr':'연합뉴스','yonhapnewstv.co.kr':'연합TV','ytn.co.kr':'YTN',
  'kbs.co.kr':'KBS','mbc.co.kr':'MBC','sbs.co.kr':'SBS',
  'jtbc.co.kr':'JTBC','tvchosun.com':'TV조선','mbn.co.kr':'MBN',
  'biz.chosun.com':'조선비즈','economist.co.kr':'이코노미스트',
};
// 중요 언론사 (중요도 가산점)
const TIER1 = new Set(['chosun.com','donga.com','joongang.co.kr','hani.co.kr','khan.co.kr','mk.co.kr','hankyung.com','yna.co.kr','kbs.co.kr','mbc.co.kr','sbs.co.kr','jtbc.co.kr']);

function sourceDisplay(d) {
  if (!d) return '';
  const c = d.replace(/^www\./,'');
  return SOURCE_DISPLAY[c] || c.replace(/\.(co\.kr|com|kr|net)$/,'').split('.').slice(-1)[0];
}
function faviconUrl(d) { return `https://www.google.com/s2/favicons?sz=32&domain=${d||'naver.com'}`; }
function sourceFaviconHtml(domain) {
  const disp = sourceDisplay(domain);
  return `<img class="source-favicon" src="${faviconUrl(domain)}"
    onerror="this.style.display='none'" alt="${disp}">`;
}

// ════════════════════════════════════════
// 중요도 스코어 (★ 1~3)
// ════════════════════════════════════════
function importanceScore(g) {
  const lead = g.lead;
  let score = 0;
  if (lead.originality === 'exclusive') score += 3;
  else if (lead.originality === 'original') score += 2;
  else score += 1;
  if (TIER1.has(lead.source)) score += 1;
  if (g.others.length >= 3) score += 1; // 많이 퍼진 뉴스
  return Math.min(score, 3); // max 3
}
function starsHtml(score) {
  return `<span class="importance-stars">${[1,2,3].map(i=>
    `<span class="star ${i<=score?'on':'off'}">★</span>`).join('')}</span>`;
}

// ════════════════════════════════════════

// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let state = {
  keywords: JSON.parse(localStorage.getItem('uae_keywords')||'["두바이","아부다비","UAE"]'),
  filters:  JSON.parse(localStorage.getItem('uae_filters')||'["축구","스포츠","골프"]'),
  viewFilter:'all',       // all/unread/read/exclusive/original/important/liked
  activeKeyword:null,
  sort:'latest',          // latest/importance
  view:'card',            // card/compact
  hidden:new Set(),
  expandedGroups:new Set(),
  data:null,
  likes: JSON.parse(localStorage.getItem('uae_likes')||'{}'),
  tags:  JSON.parse(localStorage.getItem('uae_tags')||'{}'),
  allTags: JSON.parse(localStorage.getItem('uae_allTags')||'["경제","비자","부동산","항공","외교"]'),
  read: JSON.parse(localStorage.getItem('uae_read')||'{}'),
  selectMode:false,
  selected:new Set(),
  focusedIdx:-1,
  tagModalId:null,
  _bulkIds:null,
};
function savePersist() {
  localStorage.setItem('uae_likes',JSON.stringify(state.likes));
  localStorage.setItem('uae_tags', JSON.stringify(state.tags));
  localStorage.setItem('uae_allTags',JSON.stringify(state.allTags));
  localStorage.setItem('uae_read', JSON.stringify(state.read));
  saveToCloud(); // 클라우드 동기화
}

// ════════════════════════════════════════
// API
// ════════════════════════════════════════
async function loadNews() {
  const btn = document.querySelector('.topbar-btn[onclick="loadNews()"]');
  if(btn) btn.textContent='↻ 로딩중...';
  document.getElementById('newsList').innerHTML=
    `<div class="loading"><div class="loading-spinner"></div><div class="loading-text">뉴스 불러오는 중...</div></div>`;
  try {
    let data;
    if (DEMO_MODE) { await new Promise(r=>setTimeout(r,700)); data=DEMO; }
    else {
      const p=new URLSearchParams({keywords:state.keywords.join(','),filters:state.filters.join(',')});
      const res=await fetch(`${API_BASE}?${p}`);
      if(!res.ok) throw new Error();
      data=await res.json();
    }
    state.data=data;
    const d=new Date(data.fetchedAt);
    document.getElementById('lastUpdated').textContent=
      `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')} 업데이트`;
  } catch(e){ state.data=DEMO; }
  if(btn) btn.textContent='↻ 새로고침';
  render();
}

// ════════════════════════════════════════
// RENDER
// ════════════════════════════════════════
function render() {
  if(!state.data) return;
  renderSidebarCounts();
  renderKeywords();
  renderFilters();
  renderStats();
  renderFeed();
}

function getFilteredGroups() {
  if(!state.data) return [];
  let groups = state.data.groups.filter(g=>!state.hidden.has(g.id));
  // 키워드 필터
  if(state.activeKeyword) groups=groups.filter(g=>g.lead.keyword===state.activeKeyword);
  // 뷰 필터
  const vf=state.viewFilter;
  if(vf==='unread')    groups=groups.filter(g=>!state.read[g.id]);
  else if(vf==='read') groups=groups.filter(g=>!!state.read[g.id]);
  else if(vf==='exclusive') groups=groups.filter(g=>g.lead.originality==='exclusive');
  else if(vf==='original')  groups=groups.filter(g=>g.lead.originality==='original');
  else if(vf==='important') groups=groups.filter(g=>importanceScore(g)===3);
  else if(vf==='liked')     groups=groups.filter(g=>!!state.likes[g.id]);
  // 정렬
  if(state.sort==='importance') groups=[...groups].sort((a,b)=>importanceScore(b)-importanceScore(a));
  return groups;
}

function renderSidebarCounts() {
  if(!state.data) return;
  const all = state.data.groups.filter(g=>!state.hidden.has(g.id));
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};
  set('cnt-all',all.length);
  set('cnt-unread',all.filter(g=>!state.read[g.id]).length);
  set('cnt-read',all.filter(g=>!!state.read[g.id]).length);
  set('cnt-exclusive',all.filter(g=>g.lead.originality==='exclusive').length);
  set('cnt-original',all.filter(g=>g.lead.originality==='original').length);
  set('cnt-important',all.filter(g=>importanceScore(g)===3).length);
  set('cnt-liked',Object.values(state.likes).filter(Boolean).length);
}

function renderKeywords() {
  const counts={};
  if(state.data) state.data.groups.forEach(g=>{const k=g.lead.keyword;counts[k]=(counts[k]||0)+1;});
  document.getElementById('keywordList').innerHTML=state.keywords.map(kw=>`
    <div class="keyword-item ${state.activeKeyword===kw?'active':''}" onclick="toggleKeyword('${kw}')">
      <span>${kw}</span>
      <div style="display:flex;align-items:center;gap:4px">
        <span class="keyword-count">${counts[kw]||0}</span>
        <span class="filter-remove" onclick="removeKeyword(event,'${kw}')" title="키워드 제거">×</span>
      </div>
    </div>`).join('');
}
function removeKeyword(e, kw) {
  e.stopPropagation();
  if(state.keywords.length <= 1) { alert('키워드는 최소 1개 필요합니다'); return; }
  state.keywords = state.keywords.filter(k => k !== kw);
  if(state.activeKeyword === kw) state.activeKeyword = null;
  saveKeywords();
  loadNews();
}
function saveKeywords() {
  localStorage.setItem('uae_keywords', JSON.stringify(state.keywords));
  localStorage.setItem('uae_filters', JSON.stringify(state.filters));
  saveToCloud();
}
function renderFilters() {
  document.getElementById('filterList').innerHTML=state.filters.map(f=>`
    <div class="filter-item"><span>${f}</span>
      <span class="filter-remove" onclick="removeFilter('${f}')">×</span>
    </div>`).join('');
}
function renderStats() {
  const data=state.data; if(!data) return;
  const ex=data.groups.filter(g=>g.lead.originality==='exclusive').length;
  const or=data.groups.filter(g=>g.lead.originality==='original').length;
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.total||data.groups.length}</div><div class="stat-label">전체</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--red)">${data.filteredCount}</div><div class="stat-label">필터됨</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--orange)">${ex}</div><div class="stat-label">단독</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green)">${or}</div><div class="stat-label">심층</div></div>`;
}

function renderFeed() {
  const list=document.getElementById('newsList');
  const notice=document.getElementById('filterNotice');
  const data=state.data;
  if(!data) return;

  // 필터 알림
  if(data.filteredCount>0){
    notice.style.display='flex';
    notice.innerHTML=`🚫 ${data.filteredReasons.join(', ')} 등 <strong style="color:var(--red);margin:0 3px">${data.filteredCount}건</strong> 필터됨`;
  } else notice.style.display='none';

  const groups=getFilteredGroups();

  // 피드 제목
  const filterLabels={'all':'전체','unread':'안읽음','read':'읽음',
    'exclusive':'단독','original':'심층','important':'중요','liked':'보관함'};
  document.getElementById('feedTitle').innerHTML=
    `${filterLabels[state.viewFilter]||'전체'} <strong id="feedCount">${groups.length}건</strong>`;

  if(!groups.length){
    list.innerHTML=`<div class="empty">조건에 맞는 뉴스가 없습니다</div>`;
    list.className='news-list'+(state.view==='compact'?' compact-view':'');
    return;
  }

  list.className='news-list'+(state.view==='compact'?' compact-view':'');
  if(state.selectMode) list.classList.add('select-mode');

  list.innerHTML=groups.map((g,i)=>renderCard(g,i)).join('');
}

function renderCard(g, i) {
  const lead=g.lead;
  const isGroup=g.others.length>0;
  const isExpanded=state.expandedGroups.has(g.id);
  const isLiked=!!state.likes[g.id];
  const isRead=!!state.read[g.id];
  const isSelected=state.selected.has(g.id);
  const cardTags=state.tags[g.id]||[];
  const score=importanceScore(g);
  const highlight=lead.originality==='exclusive'||lead.originality==='original';

  const badge=lead.originality==='exclusive'
    ? `<span class="orig-badge exclusive">단독</span>`
    : lead.originality==='original'
    ? `<span class="orig-badge original">심층</span>`:'';

  const title=decodeHtml(lead.title).replace(/^\[단독\]\s*/,'');
  const desc=decodeHtml(lead.description);
  const href=naverNewsUrl(lead);
  const srcDisp=sourceDisplay(lead.source);

  const thumbHtml=lead.thumbnail
    ? `<img src="${lead.thumbnail}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : fallbackThumb(lead.source);

  const dupeRows=g.others.map(n=>`
    <a class="dupe-item" href="${naverNewsUrl(n)}" target="_blank" rel="noopener noreferrer">
      <div class="dupe-src-wrap">
        <img class="dupe-favicon" src="${faviconUrl(n.source)}" onerror="this.style.display='none'" alt="">
        <span class="dupe-source">${sourceDisplay(n.source)}</span>
      </div>
      <span class="dupe-title">${decodeHtml(n.title)}</span>
      <span class="dupe-time">${n.time||''}</span>
    </a>`).join('');

  const otherSources=g.others.map(n=>sourceDisplay(n.source)).join(', ');
  const tagChips=cardTags.map(t=>`<span class="btag-chip">${t}</span>`).join('');

  return `
  <div class="news-card ${isGroup?'group-card':''} ${highlight?'highlight':''} ${isRead?'read':''} ${isSelected?'selected':''}"
       style="animation-delay:${i*35}ms" id="card-${g.id}"
       onclick="handleCardClick('${g.id}',event)">
    <input type="checkbox" class="card-checkbox" ${isSelected?'checked':''} onclick="toggleSelect('${g.id}',event)">
    <a class="group-lead-link" href="${href}" target="_blank" rel="noopener noreferrer"
       onclick="markRead('${g.id}',event)">
      <div class="card-inner">
        <div class="card-body">
          <div class="card-meta">
            <span class="read-dot" title="${isRead?'읽음':'안읽음'}"></span>
            ${badge}
            ${starsHtml(score)}
            <div class="source-row">
              ${sourceFaviconHtml(lead.source)}
              <span class="card-source">${srcDisp}</span>
            </div>
            <span class="card-time">${lead.time||''}</span>
            <div class="card-tags">${tagsFor(lead.keyword)}</div>
          </div>
          <div class="card-title">${title}</div>
          <div class="card-desc">${desc}</div>
          ${tagChips?`<div class="bookmark-tags-on-card">${tagChips}</div>`:''}
          <div class="card-footer">
            <span class="card-link">네이버 뉴스에서 보기 →</span>
            <div class="card-actions">
              <button class="heart-btn ${isLiked?'liked':''}" onclick="toggleLike('${g.id}',event)">${isLiked?'♥':'♡'}</button>
              <button class="card-action-btn" onclick="openTagModal('${g.id}',event)">🏷</button>
              <button class="card-action-btn" onclick="toggleReadBtn('${g.id}',event)">${isRead?'● 읽':'○ 읽'}</button>
              <button class="card-action-btn danger" onclick="hideCard('${g.id}',event)">✕</button>
            </div>
          </div>
        </div>
        <div class="card-thumb">${thumbHtml}</div>
      </div>
    </a>
    ${isGroup?`
    <div class="group-footer">
      <button class="dupe-toggle" onclick="toggleGroup('${g.id}',event)">
        ${isExpanded?'▲ 접기':`▼ ${srcDisp} 외 <strong style="color:var(--blue)">${g.others.length}건</strong> — ${otherSources}`}
      </button>
    </div>
    ${isExpanded?`<div class="dupe-list">${dupeRows}</div>`:''}`:''
    }
  </div>`;
}

function fallbackThumb(source) {
  return `<div style="min-height:100px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%">
    <img width="24" height="24" style="border-radius:3px;opacity:.3" src="${faviconUrl(source)}" onerror="this.style.display='none'" alt="">
    <span style="font-size:9px;color:var(--text-muted);font-family:'Space Mono',monospace">${sourceDisplay(source)}</span>
  </div>`;
}
function tagsFor(kw) {
  const m={'두바이':'dubai','아부다비':'abudhabi','UAE':'uae'};
  return `<span class="card-tag ${m[kw]||''}">${kw}</span>`;
}

// ════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════
function setViewFilter(el, filter) {
  document.querySelectorAll('#viewFilters .nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  state.viewFilter=filter;
  render();
}
function setView(v, el) {
  state.view=v;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderFeed();
}
function setSort(el, sort) {
  document.querySelectorAll('.sort-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active'); state.sort=sort; renderFeed();
}
function toggleKeyword(kw) { state.activeKeyword=state.activeKeyword===kw?null:kw; render(); }
function addKeyword() {
  const i=document.getElementById('newKeyword'),v=i.value.trim();
  if(v&&!state.keywords.includes(v)){state.keywords.push(v);i.value='';saveKeywords();loadNews();}
}
function addFilter() {
  const i=document.getElementById('newFilter'),v=i.value.trim();
  if(v&&!state.filters.includes(v)){state.filters.push(v);i.value='';saveKeywords();if(state.data)render();}
}
function removeFilter(f){state.filters=state.filters.filter(x=>x!==f);saveKeywords();if(state.data)render();}

function markRead(gid,e) {
  state.read[gid]=true; savePersist();
  const card=document.getElementById('card-'+gid);
  if(card){card.classList.add('read');}
}
function toggleReadBtn(gid,e) {
  e.stopPropagation();e.preventDefault();
  state.read[gid]=!state.read[gid]; savePersist();
  const card=document.getElementById('card-'+gid);
  if(card){
    card.classList.toggle('read',!!state.read[gid]);
    const btn=e.target; btn.textContent=state.read[gid]?'● 읽':'○ 읽';
  }
  renderSidebarCounts();
}
function toggleGroup(gid,e) {
  e.stopPropagation();e.preventDefault();
  state.expandedGroups.has(gid)?state.expandedGroups.delete(gid):state.expandedGroups.add(gid);
  render();
}
function hideCard(gid,e) {
  e.stopPropagation();e.preventDefault(); state.hidden.add(gid); render();
}
function toggleLike(gid,e) {
  e.stopPropagation();e.preventDefault();
  state.likes[gid]=!state.likes[gid]; savePersist(); render();
}
function openTagModal(gid,e) {
  e.stopPropagation();e.preventDefault();
  state.tagModalId=gid; renderTagModal();
  document.getElementById('tagModal').classList.add('open');
}
function closeTagModal() {
  document.getElementById('tagModal').classList.remove('open');
  state.tagModalId=null; state._bulkIds=null;
  if(state.selectMode) clearSelection(); else render();
}
function renderTagModal() {
  const gid=state.tagModalId;
  const selected=gid==='__bulk__'?[]:(state.tags[gid]||[]);
  document.getElementById('modalTagList').innerHTML=state.allTags.map(t=>`
    <span class="modal-tag ${selected.includes(t)?'selected':''}" onclick="toggleTagOnCard('${t}')">
      ${t}${selected.includes(t)?` <span class="tag-remove" onclick="removeTagFromAll(event,'${t}')">×</span>`:''}
    </span>`).join('');
}
function toggleTagOnCard(tag) {
  const gid=state.tagModalId; if(!gid) return;
  const ids=gid==='__bulk__'?(state._bulkIds||[]):[gid];
  ids.forEach(id=>{
    if(!state.tags[id]) state.tags[id]=[];
    const idx=state.tags[id].indexOf(tag);
    if(idx>-1) state.tags[id].splice(idx,1); else state.tags[id].push(tag);
    if(state.tags[id].length>0) state.likes[id]=true;
  });
  savePersist(); renderTagModal();
}
function addModalTag() {
  const inp=document.getElementById('modalTagInput'),v=inp.value.trim();
  if(!v) return;
  if(!state.allTags.includes(v)) state.allTags.push(v);
  toggleTagOnCard(v); inp.value='';
}
function removeTagFromAll(e,tag) {
  e.stopPropagation(); state.allTags=state.allTags.filter(t=>t!==tag);
  Object.keys(state.tags).forEach(id=>{state.tags[id]=(state.tags[id]||[]).filter(t=>t!==tag);});
  savePersist(); renderTagModal();
}

// ── 선택 모드 ──
function toggleSelectMode() {
  state.selectMode=!state.selectMode; state.selected.clear();
  document.getElementById('selectModeBtn').classList.toggle('active',state.selectMode);
  updateToolbar(); renderFeed();
}
function handleCardClick(gid,e) {
  if(!state.selectMode) return;
  if(e.target.closest('a')) return;
  toggleSelect(gid,e);
}
function toggleSelect(gid,e) {
  e.stopPropagation();e.preventDefault();
  state.selected.has(gid)?state.selected.delete(gid):state.selected.add(gid);
  const card=document.getElementById('card-'+gid);
  if(card){
    card.classList.toggle('selected',state.selected.has(gid));
    const cb=card.querySelector('.card-checkbox'); if(cb) cb.checked=state.selected.has(gid);
  }
  updateToolbar();
}
function updateToolbar() {
  const n=state.selected.size;
  document.getElementById('selectToolbar').classList.toggle('visible',state.selectMode&&n>0);
  document.getElementById('selCount').textContent=`${n}개`;
}
function clearSelection() {
  state.selected.clear(); state.selectMode=false;
  document.getElementById('selectModeBtn').classList.remove('active');
  updateToolbar(); render();
}
function bulkMarkRead(){state.selected.forEach(id=>{state.read[id]=true;});savePersist();clearSelection();}
function bulkMarkUnread(){state.selected.forEach(id=>{state.read[id]=false;});savePersist();clearSelection();}
function bulkLike(){state.selected.forEach(id=>{state.likes[id]=true;});savePersist();clearSelection();}
function bulkHide(){state.selected.forEach(id=>state.hidden.add(id));clearSelection();}
function bulkOpenTagModal(){
  const ids=[...state.selected]; if(!ids.length) return;
  state.tagModalId='__bulk__'; state._bulkIds=ids;
  renderTagModal(); document.getElementById('tagModal').classList.add('open');
}

// ── 전체 읽음 ──
function markAllRead() {
  const groups = getFilteredGroups();
  if (!groups.length) return;
  const btn = document.getElementById('markAllBtn');
  groups.forEach(g => { state.read[g.id] = true; });
  savePersist();
  // 버튼 피드백
  btn.textContent = '✓ 완료!';
  btn.style.background = 'rgba(0,135,90,.18)';
  setTimeout(() => {
    btn.textContent = '✓ 전체 읽음';
    btn.style.background = '';
    render();
  }, 600);
}

// ════════════════════════════════════════
// ⌨️ KEYBOARD SHORTCUTS
// ════════════════════════════════════════
let kbdHintVisible=false;
function toggleKbdHint() {
  kbdHintVisible=!kbdHintVisible;
  document.getElementById('kbdHint').classList.toggle('show',kbdHintVisible);
}

document.addEventListener('keydown', e => {
  // 입력 중이면 무시
  if(e.target.matches('input,textarea')) return;
  // 잠금 상태면 무시
  if(document.getElementById('lockScreen').classList.contains('show')) return;

  const groups=getFilteredGroups();
  const n=groups.length;

  switch(e.key) {
    case 'j': case 'ArrowDown':
      e.preventDefault();
      state.focusedIdx=Math.min(state.focusedIdx+1, n-1);
      focusCard(groups, state.focusedIdx);
      break;
    case 'k': case 'ArrowUp':
      e.preventDefault();
      state.focusedIdx=Math.max(state.focusedIdx-1, 0);
      focusCard(groups, state.focusedIdx);
      break;
    case 'o': case 'Enter':
      if(state.focusedIdx>=0 && state.focusedIdx<n) {
        const g=groups[state.focusedIdx];
        markRead(g.id,{});
        window.open(naverNewsUrl(g.lead),'_blank');
      }
      break;
    case 'm':
      if(state.focusedIdx>=0 && state.focusedIdx<n) {
        const g=groups[state.focusedIdx];
        state.read[g.id]=!state.read[g.id];
        savePersist(); render();
      }
      break;
    case 's':
      if(state.focusedIdx>=0 && state.focusedIdx<n) {
        const g=groups[state.focusedIdx];
        state.likes[g.id]=!state.likes[g.id];
        savePersist(); render();
      }
      break;
    case 'x':
      if(state.selectMode && state.focusedIdx>=0 && state.focusedIdx<n) {
        const g=groups[state.focusedIdx];
        const fake={stopPropagation:()=>{},preventDefault:()=>{}};
        toggleSelect(g.id,fake);
      }
      break;
    case 'r':
      loadNews(); break;
    case '?':
      toggleKbdHint(); break;
  }
});

function focusCard(groups, idx) {
  // 이전 포커스 제거
  document.querySelectorAll('.news-card.focused').forEach(c=>c.classList.remove('focused'));
  if(idx<0||idx>=groups.length) return;
  const card=document.getElementById('card-'+groups[idx].id);
  if(card){
    card.classList.add('focused');
    card.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
}

// ── 기타 ──
function escAttr(s=''){return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;')}

document.getElementById('tagModal').addEventListener('click',function(e){
  if(e.target===this) closeTagModal();
});
</script>
